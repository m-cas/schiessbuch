# Builds the native Android app (android-native/) and publishes the installable APK as a GitHub Release.
# Download link for the newest version:
#   https://github.com/m-cas/schiessbuch/releases/latest/download/CHSchiessbuch.apk
# (Schiessbuch.apk is published too, so the earlier link keeps working.)
#
# Signing: add these repository secrets (Settings → Secrets and variables → Actions)
#   ANDROID_KEYSTORE_BASE64   the .jks keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them only a test build (debug-signed) is made and attached to the
# workflow run; it is not published as a release.
name: Android app

# Started by hand only (Actions → "Android app" → Run workflow), so no build
# runs without an explicit decision.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      # The native Kotlin app (android-native/). versionCode 1000 + run number, so it
      # installs as an update over the earlier web-based app (same id and signing key).
      - name: Build APK
        working-directory: android-native
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../CHSchiessbuch.apk
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../CHSchiessbuch.apk
          fi

      - name: Copy under the earlier file name
        run: cp CHSchiessbuch.apk Schiessbuch.apk && cp CHSchiessbuch.apk MySchiessbuch.apk

      - uses: actions/upload-artifact@v6
        with:
          name: CHSchiessbuch-android-${{ github.run_number }}
          path: CHSchiessbuch.apk

      - name: Publish release
        # only signed builds become a release; unsigned test builds stay an artifact
        if: steps.key.outputs.file != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-${{ github.run_number }}
          name: CHSchiessbuch Android 2.0.${{ github.run_number }}
          body: |
            Native Android app, version 2.0.${{ github.run_number }}. Before updating from 1.0.x: save a backup in the old app (Settings → Backup speichern), then restore it in the new one.
            Install: open this page on the phone, tap **CHSchiessbuch.apk** and allow installing apps from this source when asked.
          files: |
            CHSchiessbuch.apk
            MySchiessbuch.apk
            Schiessbuch.apk
          make_latest: true
