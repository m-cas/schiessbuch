# Xcode project for the native iPhone app (SwiftUI).
# Generate the .xcodeproj with:  brew install xcodegen && xcodegen generate
name: CHSchiessbuch
options:
  bundleIdPrefix: io.github.mcas
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CHSchiessbuch:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: CHSchiessbuch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleLocalizations: [de, en]
        CFBundleDevelopmentRegion: de
        NSCameraUsageDescription: "CHSchiessbuch braucht die Kamera, um deine Scheiben zu fotografieren. / CHSchiessbuch uses the camera to photograph your targets."
        NSPhotoLibraryUsageDescription: "CHSchiessbuch braucht Zugriff auf Fotos, um Scheibenbilder hinzuzufügen. / CHSchiessbuch uses your photos to add target pictures."
        NSPhotoLibraryAddUsageDescription: "CHSchiessbuch kann Scheibenbilder in deinen Fotos speichern. / CHSchiessbuch can save target pictures to your photos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mcas.schiessbuch
        PRODUCT_NAME: CHSchiessbuch
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconClub
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
