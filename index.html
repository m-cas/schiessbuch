<style>
/* Layout: one narrow phone column like a range scorebook; sticky top bar, cards only for sessions and the keypad. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --sunken: #e4e7e1;
  --ink: #161b17;
  --muted: #5b645c;
  --line: #d3d8d0;
  --accent: #2c5a38;
  --accent-ink: #ffffff;
  --accent-soft: #dbe8dd;
  --ring: #161b17;
  --danger: #a3261d;
  --danger-soft: #f6dedb;
  --gold: #a87a12;
  --ser: #8f9a91;
  --y0: #2c5a38; --y1: #b0362c; --y2: #2f6db3; --y3: #a87a12; --y4: #6b4fa3; --y5: #3d8a8f;
  --display: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
  --body: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111512; --surface: #1a201b; --sunken: #232a24; --ink: #e8ece6; --muted: #9aa49a;
    --line: #2f3830; --accent: #7fbf8c; --accent-ink: #0f1a12; --accent-soft: #24382a;
    --ring: #e8ece6; --danger: #f08a80; --danger-soft: #3a2220; --gold: #e2b54a; --ser: #7b867c; --y0: #7fbf8c; --y1: #f08a80; --y2: #7fb0ea; --y3: #e2b54a; --y4: #b9a1e6; --y5: #7cc8cc; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111512; --surface: #1a201b; --sunken: #232a24; --ink: #e8ece6; --muted: #9aa49a;
  --line: #2f3830; --accent: #7fbf8c; --accent-ink: #0f1a12; --accent-soft: #24382a;
  --ring: #e8ece6; --danger: #f08a80; --danger-soft: #3a2220; --gold: #e2b54a; --ser: #7b867c; --y0: #7fbf8c; --y1: #f08a80; --y2: #7fb0ea; --y3: #e2b54a; --y4: #b9a1e6; --y5: #7cc8cc; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-size: 15px; overscroll-behavior-y: none; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

.bar { position: sticky; top: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .01em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 96px; display: grid; gap: 18px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: var(--surface); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.iconbtn { width: 42px; height: 42px; padding: 0; }

.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chips.disc { display: flex; gap: 0; overflow: visible; border: 1px solid var(--line); border-radius: 10px; padding: 0; }
.chips.disc .chip { flex: 1 1 0; padding: 7px 0; text-align: center; min-width: 0; border: 0; border-radius: 0; font-size: 12.5px; letter-spacing: -.01em; }
.chips.disc .chip + .chip { border-left: 1px solid var(--line); }
.chips.disc .chip:first-child { border-radius: 9px 0 0 9px; }
.chips.disc .chip:last-child { border-radius: 0 9px 9px 0; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); }
.stat { padding: 10px 0 12px; display: grid; gap: 2px; }
.stat + .stat { padding-left: 14px; border-left: 1px solid var(--line); }
.stat .v { font-size: 34px; font-weight: 600; line-height: 1; }
.stat .v small { font-size: 18px; color: var(--muted); }

.trend-toggle { width: 100%; border: 0; background: transparent; padding: 0; color: inherit; text-align: left; display: flex !important; justify-content: space-between; align-items: center; min-height: 28px; cursor: pointer; }
.trend-head.trend-toggle { align-items: center; }
.trend svg.tchev { width: 16px !important; height: 16px !important; flex: none; }
.trend-toggle .tchev { color: var(--muted); transition: transform .15s; }
.trend .trend-toggle[aria-expanded="true"] .tchev { transform: rotate(180deg); }
.trend.closed { padding-bottom: 12px; }
.trend { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 4px 2px 6px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
.legend b { font-variant-numeric: tabular-nums; }
.legend.chartkey { color: var(--muted); font-size: 12px; padding-top: 2px; }
.tiefrow { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.tiefrow label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.tiefrow input { width: 96px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-height: 44px; font-size: 18px; font-family: var(--display); font-weight: 600; text-align: center; }
.ts { font-size: 12px; color: var(--muted); font-family: var(--body); font-weight: 500; }
.slist { display: grid; gap: 2px; justify-items: end; font-size: 20px; font-weight: 700; line-height: 1.15; }
.slist small { font-size: 12px; color: var(--muted); font-weight: 500; }
.trend svg { display: block; width: 100%; height: auto; }
.trend-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

.list { display: grid; gap: 10px; }
.list { gap: 14px; }
.list-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 2px; padding-top: 18px; border-top: 6px solid var(--sunken); }
.list-h h2 { font-family: var(--display); font-size: 26px; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.ygroup { display: grid; gap: 8px; }
.yhead { display: flex; align-items: baseline; gap: 10px; border: 0; border-bottom: 2px solid var(--ink); background: transparent; padding: 6px 2px; min-height: 44px; text-align: left; }
.yname { font-family: var(--display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ycount { color: var(--muted); font-size: 13px; font-weight: 600; background: var(--sunken); border-radius: 999px; padding: 2px 10px; align-self: center; }
.ychev { margin-left: auto; }
.ychev { align-self: center; color: var(--muted); transition: transform .15s; }
.ygroup.open .ychev { transform: rotate(180deg); }
.ylist { display: grid; gap: 8px; }
.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sess.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.srow { display: flex; align-items: stretch; }
.srow-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 12px 4px 12px 14px; min-height: 52px; text-align: left; }
.sdate { flex: none; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.stitle { min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow-chev { flex: none; width: 48px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.srow-chev svg { transition: transform .15s; }
.sess.open .srow-chev svg { transform: rotate(180deg); }
.sess .card { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; }
.thumb { width: 64px; height: 64px; border-radius: 10px; background: var(--sunken); object-fit: cover; display: grid; place-items: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.card .meta { min-width: 0; display: grid; gap: 2px; }
.card .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .s { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score { text-align: right; }
.score .big { font-size: 30px; font-weight: 700; line-height: 1; }
.score .of { font-size: 13px; color: var(--muted); }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg3 button { border: 0; background: transparent; min-height: 44px; font-weight: 600; font-size: 15px; padding: 0 6px; }
.seg3 button + button { border-left: 1px solid var(--line); }
.seg3 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip.multi[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.multi[aria-pressed="true"]::before { content: "✓ "; }
.filters { display: grid; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.frow { display: grid; gap: 6px; min-width: 0; }
.frow + .frow { border-top: 1px dashed var(--line); padding-top: 10px; }
.cat-tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-top: 4px; }
.pct-pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-top: 4px; }

.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 28px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty h2 { margin: 0; color: var(--ink); font-size: 18px; }
.note { font-size: 13px; color: var(--muted); }
.warn { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--danger-soft); color: var(--danger); }

/* Editor */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.logo { width: 44px; height: 44px; object-fit: contain; border-radius: 10px; flex: none; display: block; }
.logobtn { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.logobtn { position: relative; flex: none; border: 0; padding: 0; background: transparent; border-radius: 10px; }
.logobtn .gear { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); display: grid; place-items: center; }
.logobtn .alert-dot { position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--danger); border: 2px solid var(--bg); }
.settings { display: grid; gap: 22px; }
.settings h2 { font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 10px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.settings .langsw button { min-height: 44px; padding: 0 22px; font-size: 15px; }
.switchrow { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.switchrow .lbl { display: grid; gap: 2px; min-width: 0; }
.switchrow .lbl strong { font-weight: 600; }
.switchrow img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; flex: none; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.field input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; height: 44px; line-height: 22px; text-align: left; }
.field input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
.field input[type="date"]::-webkit-calendar-picker-indicator { margin: 0; }
.field select { min-width: 0; max-width: 100%; text-overflow: ellipsis; }
.field label, .field .flabel { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; font-size: 16px; }
.field textarea { min-height: 72px; resize: vertical; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.row2.date-row { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); }
@media (max-width: 380px) { .row2 { grid-template-columns: 1fr; } }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.section-h h2 { font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; margin: 0; }

.series { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.series.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.series-head { display: flex; align-items: center; gap: 8px; }
.series-head .name { font-weight: 600; flex: 1; min-width: 0; }
.series-head .tot { font-size: 26px; font-weight: 700; }
.series-head .tot small { font-size: 14px; color: var(--muted); font-weight: 500; }
.shots { display: flex; flex-wrap: wrap; gap: 6px; }
.shot { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--ring); background: transparent; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 18px; padding: 0; }
.shot.x { background: var(--ring); color: var(--bg); }
.shot.top { border-color: var(--gold); color: var(--gold); }
.shot.slot { border-style: dashed; border-color: var(--line); color: var(--muted); font-size: 14px; }
.shot.slot.next { border-color: var(--accent); color: var(--accent); }
.shot.prac { border-color: var(--muted); color: var(--muted); border-style: dotted; }
.shot.slot.prac.next { border-color: var(--accent); color: var(--accent); }
.seg { display: grid; gap: 4px; }
.seg-l { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg-l:empty { display: none; }
.series .field select { min-height: 40px; font-size: 15px; padding: 8px 10px; }
.series-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.stepper { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.stepper button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: transparent; padding: 0; }
.manual { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.manual input { width: 76px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); font-size: 16px; }

.keypad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-top: 8px; box-shadow: 0 -6px 20px rgba(0,0,0,.08); }
.keypad-in { max-width: 640px; margin: 0 auto; display: grid; gap: 8px; }
.keypad-top span:first-child { white-space: nowrap; }
.keypad-top span:last-child { text-align: right; }
.keypad-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
.keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.key { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-family: var(--display); font-size: 24px; font-weight: 600; padding: 0; }
.key.x { background: var(--ring); color: var(--bg); border-color: var(--ring); }
.key.back { font-family: var(--body); font-size: 15px; }
.numentry { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; }
.numentry input { min-width: 0; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px; font-family: var(--display); font-size: 26px; font-weight: 600; }
.numentry .key { padding: 0 16px; }
.key:disabled, .numentry input:disabled { opacity: .45; }
.key.add { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--body); font-size: 16px; }
.shot { font-variant-numeric: tabular-nums; }
body.typing .keypad { display: none; }
.series .lock { margin: 0; font-size: 13px; color: var(--muted); }
.champ { display: grid; gap: 14px; }
.help { display: grid; gap: 10px; }
.help-sec { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px; }
.help-sec summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 16px; }
.help-sec summary::-webkit-details-marker { display: none; }
.help-sec[open] summary .chev { transform: rotate(180deg); }
.help-sec p { margin: 10px 0 0; line-height: 1.5; max-width: 65ch; }
a.btn { text-decoration: none; color: inherit; }
.confirm.info { border-color: var(--accent); background: var(--surface); color: var(--ink); }
.ch-tabs { justify-self: start; }
.ch-load { display: grid; gap: 8px; }
.ch-urlrow { display: flex; gap: 8px; }
.ch-urlrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; min-height: 42px; font-size: 15px; }
.ch-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.ch-head h2 { margin: 2px 0 0; font-size: 20px; }
.ch-bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.ch-bar span { display: block; height: 100%; background: var(--accent); }
.ch-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ch-item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.ch-main { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: end; }
.ch-main .ch-check { align-self: start; }
.ch-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 22px; font-weight: 600; line-height: 1; display: grid; place-items: center; }
.ch-btn.plus { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ch-btn.x { color: var(--danger); font-size: 17px; }

.ch-top .ch-head { flex: 1; }

async function backupJson() {
  const photos = [];
  for (const x of S.sessions) for (const id of x.photos || []) { try { photos.push({ id, data: await toDataUrl(id) }); } catch {} }

}
async function makeBackup(mail) {
  S.backingUp = true; render();
  try {
    const json = await backupJson(), name = `${t("backupFile")}-${today()}`;
    if (mail && NATIVE) {
      await nativeShare({ title: t("backupMailSubject", fmtDate(today())), text: t("backupMailText"), files: [{ name: name + ".json", data: json, type: "application/json" }] });
    } else if (mail) {
      // Some phones only attach common file types, so fall back to .txt; Restore accepts both.
      const cands = [new File([json], name + ".json", { type: "application/json" }), new File([json], name + ".txt", { type: "text/plain" })];
      const f = navigator.share && navigator.canShare ? cands.find((c) => navigator.canShare({ files: [c] })) : null;
      if (f) {
        try { await navigator.share({ files: [f], title: t("backupMailSubject", fmtDate(today())), text: t("backupMailText") }); }
        catch (e) { if (!(e && e.name === "AbortError")) throw e; }
      } else { await shareOrSave(name + ".json", json, "application/json"); toast(t("backupNoShare")); }
    } else {
      await shareOrSave(name + ".json", json, "application/json");
    }
  } catch { toast(t("exportFail")); } finally { S.backingUp = false; render(); }
}
async function bulkDelete() {
  const ids = [...S.picked], n = ids.length;
  try {
    for (const id of ids) {
      const x = S.sessions.find((s) => s.id === id); if (!x) continue;
      await dbDel(id);
      for (const pid of x.photos || []) { try { await photoDel(pid); } catch {} }
    }
    S.picked.clear(); S.selecting = false; S.bulkAsk = false;
    await refresh(); render(); toast(t("bulkDeleted", n));
  } catch { S.bulkAsk = false; await refresh(); render(); toast(t("delFail")); }
}
async function restoreBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== "scorebook" || !Array.isArray(data.sessions)) return toast(t("badBackup"));
    let missing = 0;
    for (const p of data.photos || []) { try { await photoPut(dataUrlToBlob(p.data), p.id); } catch { missing++; } }
    for (const x of data.sessions) if (x && x.id && Array.isArray(x.series)) await dbPut(x);
    if (data.championship && typeof data.championship === "object" && (data.championship.current || (data.championship.history || []).length)) { S.champ = { url: data.championship.url || S.champ.url, current: data.championship.current || null, history: data.championship.history || [] }; saveChamp(); }
    clearPhotoCache();
    await refresh(); render(); toast(t("restored", data.sessions.length) + (missing ? " · " + t("photosMissing", missing) : ""));
  } catch { toast(t("restoreFail")); }
}

const CHEV = `<svg class="tchev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function trendView(rows) {
  const by = new Map();
  for (const x of rows) { const y = (x.date || "").slice(0, 4); if (!/^\d{4}$/.test(y)) continue; if (!by.has(y)) by.set(y, []); by.get(y).push(x); }
  const years = [...by.keys()].sort().reverse().slice(0, 6);
  if (!years.length) return "";
  const doy = (d) => { const dt = new Date(d + "T12:00:00"), y0 = new Date(dt.getFullYear(), 0, 1), y1 = new Date(dt.getFullYear() + 1, 0, 1); return (dt - y0) / (y1 - y0); };
  const series = years.map((y, ci) => ({ y, ci, pts: by.get(y).slice().sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.createdAt || 0) - (b.createdAt || 0)).map((x) => { const vals = x.series.map(seriesNorm).filter((v) => v !== null); if (!vals.length) return null; return { f: doy(x.date), v: Math.round((vals.reduce((a, v) => a + v, 0) / vals.length) * 10) / 10, vals }; }).filter(Boolean) })).filter((s) => s.pts.length);
  if (!series.length) return "";
  const all = series.flatMap((s) => s.pts.flatMap((p) => p.vals));
  const mn = Math.min(...all), mx = Math.max(...all);
  const pad = Math.max((mx - mn) * 0.12, mx * 0.02, 1);
  const lo = Math.max(0, Math.floor(mn - pad)), hi = Math.min(100, Math.ceil(mx + pad));
  const W = isWide() ? 1100 : 600, H = 250, pl = 46, pr = 14, pt = 14, pb = 34;

  const grid = months.map((_, m) => `<line x1="${sx(m / 12).toFixed(1)}" x2="${sx(m / 12).toFixed(1)}" y1="${pt}" y2="${H - pb}" stroke="var(--line)" stroke-width="1" opacity=".6"/>`).join("")
    + months.map((lab, m) => `<text x="${sx((m + 0.5) / 12).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="15" fill="var(--muted)" font-family="-apple-system, system-ui, sans-serif">${esc(lab)}</text>`).join("")
    + ticks.map((v) => `<line x1="${pl}" x2="${W - pr}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${(sy(v) + 5).toFixed(1)}" text-anchor="end" font-size="15" fill="var(--muted)" font-family="-apple-system, system-ui, sans-serif">${v}</text>`).join("");
  const bars = series.map((s) => s.pts.filter((p) => p.vals.length > 1).map((p) => {
    const x = sx(p.f).toFixed(1), lo2 = Math.min(...p.vals), hi2 = Math.max(...p.vals);

  }).join("")).join("");
  const anyBars = series.some((s) => s.pts.some((p) => p.vals.length > 1));
  const lines = series.slice().reverse().map((s) => {
    const c = `var(--y${s.ci})`, w = s.ci === 0 ? 3.5 : 2.5;

  if (!S.chartOpen) return `<div class="trend closed"><button class="trend-head trend-toggle" data-act="chart" aria-expanded="false"><span class="eyebrow">${t("trendYears")}</span>${CHEV}</button></div>`;

    ${anyBars ? `<div class="legend chartkey"><span><i style="background:var(--ink);height:4px"></i>${t("keySession")}</span><span><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><line x1="7" x2="7" y1="3" y2="13" stroke="var(--ser)" stroke-width="3" stroke-linecap="round"/><circle cx="7" cy="3" r="2.5" fill="var(--surface)" stroke="var(--ser)" stroke-width="1.6"/><circle cx="7" cy="13" r="2.5" fill="var(--surface)" stroke="var(--ser)" stroke-width="1.6"/></svg>${t("keySeries")}</span></div>` : ""}</div>`;

  return out;
}
function parseChamp(text) {
  text = String(text || "").replace(/^﻿/, "");
  const first = text.split(/\r?\n/).find((l) => l.trim()) || "";
  const sep = [";", "\t", ","].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = csvRows(text, sep);
  if (rows.length < 2) throw new Error(t("chNoRows"));
  const head = rows[0].map((h) => h.toLowerCase().replace(/[^a-zäöü]/g, ""));
  const col = {}; for (const [k, names] of Object.entries(CH_COLS)) { const i = head.findIndex((h) => names.includes(h)); if (i >= 0) col[k] = i; }
  if (col.title === undefined || col.disc === undefined) throw new Error(t("chNeedCols"));
  const warnings = [], items = [], ids = new Set();
  let year = null, name = "";
  rows.slice(1).forEach((r, n) => {
    const line = n + 2, get = (k) => (col[k] !== undefined ? r[col[k]] || "" : "");
    const title = get("title"); if (!title) return;
    const preset = champDisc(get("disc"));
    if (!preset) { warnings.push(t("chBadDisc", line, get("disc"))); return; }
    const y = get("year").match(/\d{4}/); if (y && !year) year = Number(y[0]);
    if (!name && get("champ")) name = get("champ");
    let id = get("id") || title; while (ids.has(id)) id += "*"; ids.add(id);
    const series = champSeries(get("series"), preset, (tok) => warnings.push(t("chBadSeries", line, tok)));
    items.push({ id, title, preset, series, date: champDate(get("date")), location: get("location"), notes: get("notes"), sessionId: null });
  });
  if (!items.length) throw new Error(t("chNoRows"));
  if (!year) { const d = items.map((x) => x.date).find(Boolean); if (d) year = Number(d.slice(0, 4)); }
  if (!year) throw new Error(t("chNoYear"));
  return { year, name: name || t("chDefaultName", year), loadedAt: Date.now(), items, warnings };
}
function champUrl(u) {
  u = String(u || "").trim();
  try {
    const x = new URL(u);
    if (/(^|\.)dropbox\.com$/.test(x.hostname)) { x.hostname = "dl.dropboxusercontent.com"; x.searchParams.delete("dl"); return x.toString(); }
    const g = x.hostname === "drive.google.com" && x.pathname.match(/\/file\/d\/([^/]+)/); if (g) return `https://drive.google.com/uc?export=download&id=${g[1]}`;
    if (x.hostname === "github.com" && x.pathname.includes("/blob/")) return `https://raw.githubusercontent.com${x.pathname.replace("/blob/", "/")}`;
  } catch {}
  return u;
}
async function champFetch() {
  const url = (S.champ.url || "").trim();
  if (!/^https?:\/\//i.test(url)) return toast(t("chNeedUrl"));
  S.champBusy = true; render();
  try {
    const r = await fetch(champUrl(url), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    champLoaded(await r.text());
  } catch (e) { toast(e && e.message && !/fetch|network|load failed/i.test(e.message) ? e.message : t("chFetchFail")); }
  finally { S.champBusy = false; render(); }
}
function champLoaded(text) {
  let p; try { p = parseChamp(text); } catch (e) { return toast(e.message || t("chBadFile")); }
  const cur = S.champ.current;
  if (!cur) return champApply(p);
  S.champAsk = { p, same: cur.year === p.year }; render(); scrollTo(0, 0);
}
function champApply(p) {
  const ch = S.champ, cur = ch.current;
  const keep = (from) => { if (!from) return; const m = new Map(from.items.map((x) => [x.id, x.sessionId])); p.items.forEach((x) => { if (!x.sessionId && m.get(x.id)) x.sessionId = m.get(x.id); }); };
  // only one championship: a file of another year replaces it (the recorded sessions stay)
  if (cur && cur.year === p.year) keep(cur);
  ch.history = [];
  const warns = p.warnings; delete p.warnings;
  ch.current = p; S.champAsk = null; S.view = "champ"; saveChamp(); render();
  toast(t("chLoaded", p.items.length, p.year) + (warns.length ? " · " + t("chWarnN", warns.length) : ""));
  S.champWarn = warns;
}
const champSession = (item) => (item && item.sessionId ? S.sessions.find((x) => x.id === item.sessionId) || null : null);
async function champActivate(id) {
  const item = S.champ.current && S.champ.current.items.find((x) => x.id === id); if (!item) return;
  const last = S.sessions[0];
  const x = { id: newId(), date: today(), preset: item.preset, category: "championship", desc: item.title, location: item.location || (last && last.location) || "",
    weapon: (last && pkey(last) === item.preset && last.weapon) || "", conditions: "", notes: item.notes || "", photos: [],
    series: item.series.map((s) => ({ type: s.type, target: s.target || "A10", planned: s.planned, practice: s.practice || 0, ...(s.parts ? { parts: s.parts.map((q) => ({ ...q })) } : {}), shots: [], total: null, tief: null })),
    createdAt: Date.now(), updatedAt: Date.now() };
  try { await dbPut(x); } catch { return toast(t("saveFail")); }
  item.sessionId = x.id; saveChamp(); await refresh();
  S.current = S.sessions.find((s) => s.id === x.id) || x; S.returnTo = "champ";
  const d = normSession(structuredClone(S.current));
  S.draft = { ...d, addedPhotos: [], removedPhotos: [], conditions: "", notes: d.notes || "", category: "championship", desc: d.desc || "", location: d.location || "", weapon: d.weapon || "" };
  S.active = 0; S.view = "edit"; render(); scrollTo(0, 0);   // no applyPreset: it would replace the empty series with the default format
}
async function champReset(id, del) {
  const item = S.champ.current && S.champ.current.items.find((x) => x.id === id); if (!item) return;
  const x = champSession(item);

  toast(del && x ? t("chResetDel") : t("chResetKeep"));
}
function champResult(x) {
  const done = x.series.filter(hasResult);

// Each series shows only its grouping and practice shots ("3 Probe + 10 + 10", "2 Probe + 6 + 4").
const champSeriesText = (s) => s.parts ? groupingText(s.parts)

  : groupingText(SERIES_TYPES[s.type].segs.map((g, i) => ({ k: g.k, n: g.n, g: i + 1 })));
function champItemView(item) {

ain; you choose whether the recorded session is kept or deleted.", "Only one championship is kept. A file for another year replaces it (the app asks first); recorded sessions always stay. Reloading the same year keeps activated items activated.", "File format: a header line, then one line per session with the columns id;jahr;meisterschaft;titel;disziplin;serien;datum;schiessstand;notizen. An example file is in the web version.", "Column serien: ! separates series, + joins parts into one series. c:10:a10!c:5:a10 gives two series (10 and 5 shots), each with its own total; c:6:a10+c:4:a10 gives one series with groups of 6 and 4, each with a subtotal, and one overall total. c:10:a10:3 means 3 practice shots and 10 counted shots.", "The list shows only the grouping of each series with any practice shots, e.g. \"3 practice + 10 + 10\" or \"10 | 5\"."]}, {"t": "Data and backup", "p": ["All sessions and photos stay on this device only. Nothing is uploaded.", "Save a backup now and then (Settings → Save backup or Email backup), and always before changing phones. Restore backup loads it again; photos and the championship are included.", "When the backup is larger than 20 MB, a red warning triangle appears: too large for most email services. Use Save backup and keep it in e.g. Dropbox or Google Drive.", "Export as CSV creates a table with one row per series, for Excel or Google Sheets."]}, {"t": "Settings", "p": ["Tap the logo at the top left. There you choose the language (Deutsch or English), help, export and backup."]}]};

/* ---------- printing selected sessions (full page width, one block per session) ---------- */
async function printSessions(ids) {
  const xs = S.sessions.filter((x) => ids.includes(x.id)).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const urls = new Map();
  for (const x of xs) for (const id of (x.photos || []).slice(0, 4)) { try { const b = await photoGet(id); if (b) urls.set(id, URL.createObjectURL(b)); } catch {} }
  const range = xs.length > 1 ? `${fmtDate(xs[0].date)} – ${fmtDate(xs[xs.length - 1].date)}` : xs.length ? fmtDate(xs[0].date) : "";
  const blocks = xs.map((x) => {
    const meta = [x.location && `${t("range")}: ${x.location}`, x.weapon && `${t("weapon")}: ${x.weapon}`, x.conditions && `${t("conditions")}: ${x.conditions}`].filter(Boolean).join(" · ");
    const rows = x.series.map((sr, i) => { const ss = seriesStats(sr, x.max), gl = groupLine(sr);
      return `<tr><td class="pr-c">${i + 1}</td><td>${esc(seriesLabel(sr))}</td><td class="pr-shots">${esc(sr.shots.length ? shotsText(sr) : ss.manual ? t("totalOnly") : "—")}${gl ? `<br><b>${esc(gl)}</b>` : ""}</td><td class="pr-c">${ss.x || ""}</td><td class="pr-c">${sr.tief != null ? sr.tief : ""}</td><td class="pr-r"><b>${fmtScore(ss.total)}</b> / ${ss.max}</td></tr>`; }).join("");
    const pics = (x.photos || []).slice(0, 4).filter((id) => urls.has(id)).map((id) => `<img src="${urls.get(id)}" alt="">`).join("");
    const st = sessionStats(x);
    return `<div class="pr-sess"><div class="pr-h"><span>${esc(fmtDate(x.date))} · ${esc(catLabel(x))} · ${esc(plabel(pkey(x)))}</span>${st.max ? `<span>${t("printTotal")} ${fmtScore(st.total)} / ${st.max}</span>` : ""}</div>
      ${descOf(x) ? `<p class="pr-desc">${esc(descOf(x))}</p>` : ""}${meta ? `<p class="pr-meta">${esc(meta)}</p>` : ""}
      <table><thead><tr><th class="pr-c">#</th><th>${t("seriesFormat")}</th><th>${t("shotsH")}</th><th class="pr-c">X</th><th class="pr-c">${t("tiefShort")}</th><th class="pr-r">${t("score")}</th></tr></thead><tbody>${rows}</tbody></table>
      ${x.notes ? `<p class="pr-notes"><b>${t("notes")}:</b> ${esc(x.notes)}</p>` : ""}${pics ? `<div class="pr-pics">${pics}</div>` : ""}</div>`;
  }).join("");
  let area = $("#printArea"); if (!area) { area = document.createElement("div"); area.id = "printArea"; document.body.appendChild(area); }
  area.innerHTML = `<div class="pr-head"><div class="pr-title">${t("appName")} · ${t("printTitle")}</div><span>${esc(range)} · ${t("sessionsN", xs.length)}</span></div>${blocks}`;
  const done = () => { area.innerHTML = ""; for (const u of urls.values()) URL.revokeObjectURL(u); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  await Promise.all([...area.querySelectorAll("img")].map((im) => (im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; }))));
  window.print();
}

/* ---------- hold the logo for 10 seconds: switch between app icon and SG Muttenz logo ---------- */
(() => {
  let timer = null;
  const stop = () => { clearTimeout(timer); timer = null; };
  document.addEventListener("pointerdown", (e) => {
    if (!e.target.closest("#logobtn")) return;
    stop();
    timer = setTimeout(() => {
      timer = null; S.longPressed = true;
      S.clubLogo = !S.clubLogo; try { localStorage.setItem("scorebook-logo", S.clubLogo ? "club" : "app"); } catch {}
      if (navigator.vibrate) try { navigator.vibrate(30); } catch {}
      render(); toast(S.clubLogo ? t("logoClubOn") : t("logoClubOff"));

  document.addEventListener("contextmenu", (e) => { if (e.target.closest && e.target.closest("#logobtn")) e.preventDefault(); });

/* ---------- actions ---------- */
function newDraft() {
  const last = S.sessions[0];
  const preset = last ? pkey(last) : "r300";
  return { id: null, date: today(), preset, category: last ? catOf(last) : "training", desc: "", location: last ? last.location || "" : "", weapon: last ? last.weapon || "" : "", conditions: "", notes: "",
    series: [newSeries(preset)], photos: [], addedPhotos: [], removedPhotos: [] };
}
function applyPreset(key, reset = true) {
  const d = S.draft;
  d.preset = PRESETS[key] ? key : "other";
  if (!PRESETS[d.preset].x) d.series.forEach((s) => (s.shots = s.shots.map((v) => (v === "X" ? 10 : v))));
  // Each discipline has its own formats; series in a format the new discipline lacks become custom.
  const allowed = formatsFor(d.preset), empty = d.series.every((s) => !hasResult(s));
  if (empty && reset) { d.series = d.series.map(() => newSeries(d.preset)); return; }
  d.series.forEach((s) => {
    if (!allowed.includes(stype(s))) {
      const st = seriesStats(s);
      s.type = "custom"; s.target = s.target || "A10"; s.practice = st.practiceN; s.planned = Math.max(st.counted, s.shots.length - st.practiceN);
    }
    if (!targetChoice(d.preset)) s.target = "A10";
    clampShots(s);
  });
}
function clampShots(s) {
  s.shots = s.shots.map((v, j) => { const m = segMax(s, j); if (v === "X") return m === 10 && (s.target || "A10") === "A10" && !(segAt(s, j) || {}).max ? "X" : m; return Math.min(Number(v), m); });
}
function addShot(v) {
  const d = S.draft, s = d.series[S.active];
  const ss = seriesStats(s, d.max);
  if (ss.manual) return;
  if (s.shots.length >= ss.planned) { toast(fixed(s) ? t("seriesFull") : t("seriesFullCustom")); return; }
  s.shots.push(v); s.total = null;

  if (s.shots.length >= ss.planned && S.active < d.series.length - 1) S.active++;
  if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
}

async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b), "image/jpeg", 0.85));
  } catch { return file; } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(files) {
  for (const f of files) {
    S.uploads++; render();
    try {
      const b = await compress(f);
      const r = await S.assets.upload(b, { type: b.type && b.type.startsWith("image/") ? b.type : "image/jpeg" });
      S.draft.photos.push(r.id); S.draft.addedPhotos.push(r.id);
    } catch (e) {
      toast(e && e.name === "QuotaExceededError" ? t("storageFull") : t("photoFail"));
    } finally { S.uploads--; render(); }
  }
}

async function save() {
  const d = S.draft;
  if (!d.date) return toast(t("addDate"));
  const tiefs = d.series.map((s) => String(s.tief ?? "").trim());
  const bad = tiefs.findIndex((v) => v !== "" && !(Number.isInteger(Number(v)) && Number(v) >= 0 && Number(v) <= 100));
  if (bad >= 0) { toast(t("tiefErr", bad + 1)); S.active = bad; const el = $("#ts-" + bad); if (el) el.focus(); return; }
  S.saving = true; render();
  const body = { date: d.date, preset: d.preset, category: CATS.includes(d.category) ? d.category : "other", location: d.location.trim(), weapon: d.weapon.trim(), conditions: d.conditions.trim(), notes: d.notes.trim(),
    photos: d.photos.slice(),
    desc: (d.desc || "").trim(), series: d.series.map((s) => ({ type: stype(s), target: stype(s) === "custom" ? s.target || "A10" : "A10", planned: fixed(s) ? seriesStats(s, 1).planned : seriesStats(s).counted, practice: stype(s) === "custom" ? seriesStats(s).practiceN : 0, shots: s.shots.slice(), ...(composite(s) ? { parts: s.parts.map((q) => ({ ...q })) } : {}), total: s.total === "" || s.total === null || s.total === undefined ? null : Number(s.total), tief: tiefs[d.series.indexOf(s)] === "" ? null : Number(tiefs[d.series.indexOf(s)]) })),
    createdAt: d.createdAt || Date.now(), updatedAt: Date.now() };
  try {
    const id = d.id || newId();
    await dbPut({ id, ...body });
    for (const pid of d.removedPhotos) { try { await S.assets.delete(pid); } catch {} }
    S.saving = false; S.draft = null; S.current = { id, ...body }; S.view = "detail"; S.confirmDel = false;
    await refresh();
    render(); toast(t("saved")); scrollTo(0, 0);
  } catch (e) {
    S.saving = false; render();
    toast(e && e.name === "QuotaExceededError" ? t("dbFull") : t("saveFail"));
  }
}
async function discard() {
  const d = S.draft;
  if (d) for (const id of d.addedPhotos) { try { await S.assets.delete(id); } catch {} }
  S.draft = null; S.view = S.current ? "detail" : "list"; render(); scrollTo(0, 0);
}
async function removeSession() {
  const x = S.current;
  try {
    await dbDel(x.id);
    for (const id of x.photos || []) { try { await S.assets.delete(id); } catch {} }
    S.current = null; S.view = S.returnTo === "champ" ? "champ" : "list"; S.returnTo = null; S.confirmDel = false; await refresh(); render(); toast(t("deleted"));
  } catch { toast(t("delFail")); }
}
async function exportCsv() {
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [t("csvHead").join(",")].concat(S.sessions.flatMap((x) => { const k = pkey(x);
    return x.series.map((s, i) => { const ss = seriesStats(s), nv = seriesNorm(s);
      return [x.date, plabel(k), catLabel(x), descOf(x), x.location, x.weapon, x.conditions, i + 1, seriesLabel(s), hasResult(s) ? ss.total : "", ss.max, nv ?? "", ss.x, s.tief ?? "", s.shots.length ? shotsText(s) : "", x.notes].map(q).join(","); }); }));
  try { await S.downloads.save({ filename: `${t("csvFile")}-${today()}.csv`, data: "﻿" + lines.join("\n") }); } catch (e) { if (e && e.code !== "declined" && e.code !== "cancelled") toast(t("exportFail")); }
}
function openLightbox(i) {
  const ids = S.current.photos, lb = $("#lightbox");
  const show = () => { lb.innerHTML = `<div class="lb-bar"><span>${i + 1} / ${ids.length}</span><span style="display:flex;gap:8px">${ids.length > 1 ? `<button data-lb="prev">${t("prev")}</button><button data-lb="next">${t("next")}</button>` : ""}<button data-lb="close">${t("close")}</button></span></div><img data-pid="${ids[i]}" src="${blob(ids[i])}" alt="${t("targetPhoto", i + 1)}">`; };
  show(); lb.hidden = false;
  lb.onclick = (e) => { const a = e.target.closest("[data-lb]"); if (!a) return; if (a.dataset.lb === "close") { lb.hidden = true; return; }
    i = (i + (a.dataset.lb === "next" ? 1 : -1) + ids.length) % ids.length; show(); };
}
function setLang(l) {
  LANG = l; try { localStorage.setItem("scorebook-lang", l); } catch {}
  if (S.view === "mail" && S.mail && !S.mail.edited) S.mail = buildMail(S.mail.ids, S.mail.to);
  render();

document.addEventListener("click", (e) => {
  const key = e.target.closest("[data-key]");
  if (key && S.view === "edit") {
    const v = key.dataset.key, s = S.draft.series[S.active];
    if (v === "back") s.shots.pop(); else { const g = segAt(s, s.shots.length); addShot(v === "X" ? (g && g.max ? g.max : "X") : Number(v)); }
    render(); return;
  }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, si = Number(a.dataset.s);
  switch (act) {
    case "settings": if (S.longPressed) { S.longPressed = false; break; } if (S.view === "list" || S.view === "detail") { S.prevView = S.view; S.view = "settings"; S.selecting = false; S.picked.clear(); render(); scrollTo(0, 0); } break;
    case "closesettings": S.view = S.prevView && S.current ? S.prevView : "list"; render(); scrollTo(0, 0); break;
    case "setlang": if (a.dataset.v !== LANG) setLang(a.dataset.v); break;
    case "new": S.current = null; S.draft = newDraft(); S.active = 0; S.view = "edit"; render(); scrollTo(0, 0); break;
    case "filter": S.filter = a.dataset.v; render(); break;
    case "catfilter": { const c = a.dataset.v; if (S.cats.has(c)) { if (S.cats.size > 1) S.cats.delete(c); } else S.cats.add(c);
      try { localStorage.setItem("scorebook-cats", JSON.stringify([...S.cats])); } catch {} render(); break; }
    case "cat": if (S.draft) { S.draft.category = a.dataset.v; render(); } break;
    case "open": S.current = S.sessions.find((x) => x.id === a.dataset.id); S.view = "detail"; S.confirmDel = false; render(); scrollTo(0, 0); break;
    case "back": S.view = S.returnTo === "champ" ? "champ" : "list"; S.returnTo = null; S.current = null; render(); break;
    case "champ": S.view = "champ"; S.selecting = false; S.picked.clear(); S.champAsk = null; S.champReset = null; render(); scrollTo(0, 0); break;
    case "champback": S.view = "list"; S.champAsk = null; S.champReset = null; S.champWarn = null; render(); scrollTo(0, 0); break;
    case "help": S.view = "help"; render(); scrollTo(0, 0); break;
    case "helpback": S.view = "settings"; render(); scrollTo(0, 0); break;
    case "champset": S.view = "champset"; S.champReset = null; render(); scrollTo(0, 0); break;
    case "champsetback": S.view = "champ"; S.champAsk = null; render(); scrollTo(0, 0); break;
    case "chfetch": champFetch(); break;
    case "chapply": if (S.champAsk) champApply(S.champAsk.p); break;
    case "chaskno": S.champAsk = null; render(); break;
    case "chact": champActivate(a.dataset.id); break;
    case "chreset": S.champReset = a.dataset.id; render(); break;
    case "chresetno": S.champReset = null; render(); break;
    case "chkeep": champReset(a.dataset.id, false); break;
    case "chdel": champReset(a.dataset.id, true); break;
    case "chopen": { const x = S.sessions.find((s) => s.id === a.dataset.id); if (x) { S.current = x; S.returnTo = "champ"; S.view = "detail"; S.confirmDel = false; render(); scrollTo(0, 0); } break; }
    case "edit": { const x = normSession(structuredClone(S.current)); S.draft = { ...x, addedPhotos: [], removedPhotos: [], conditions: x.conditions || "", notes: x.notes || "", category: catOf(x), desc: descOf(x), location: x.location || "", weapon: x.weapon || "" }; applyPreset(S.draft.preset, false); S.active = 0; S.view = "edit"; render(); scrollTo(0, 0); break; }
    case "cancel": discard(); break;
    case "save": save(); break;
    case "del": S.confirmDel = true; render(); break;
    case "nodel": S.confirmDel = false; render(); break;
    case "yesdel": removeSession(); break;
    case "csv": exportCsv(); break;
    case "backup": makeBackup(false); break;
    case "hidehint": try { localStorage.setItem("scorebook-chrome-hint", "hidden"); } catch {} render(); break;
    case "copyurl": { const u = location.href.split("#")[0]; try { navigator.clipboard.writeText(u).then(() => toast(t("urlCopied")), () => toast(u)); } catch { toast(u); } break; }
    case "mailbackup": makeBackup(true); break;
    case "bulkdel": if (S.picked.size) { S.bulkAsk = true; render(); } break;
    case "bulkno": S.bulkAsk = false; render(); break;
    case "bulkyes": bulkDelete(); break;
    case "shareall": shareMail(); break;
    case "select": S.selecting = true; S.bulkAsk = false; S.picked.clear(); render(); break;
    case "selcancel": S.selecting = false; S.bulkAsk = false; S.picked.clear(); render(); break;
    case "selall": if (S.picked.size === S.sessions.length) S.picked.clear(); else S.sessions.forEach((x) => S.picked.add(x.id)); render(); break;
    case "year": { const y = a.dataset.y; S.openYears.has(y) ? S.openYears.delete(y) : S.openYears.add(y); render(); break; }
    case "toggle": { const id = a.dataset.id; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); render(); break; }
    case "pick": { S.bulkAsk = false; const id = a.dataset.id; S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id); render(); break; }
    case "chart": S.chartOpen = !S.chartOpen; try { localStorage.setItem("scorebook-chart", S.chartOpen ? "1" : "0"); } catch {} render(); break;
    case "printpicked": if (S.picked.size) printSessions([...S.picked]); break;
    case "mailpicked": S.current = null; startMail([...S.picked]); break;
    case "mailone": startMail([S.current.id]); break;
    case "mailback": S.mail = null; S.selecting = false; S.picked.clear(); S.view = S.current ? "detail" : "list"; render(); scrollTo(0, 0); break;
    case "mailcopy": {
      const text = (S.mail.to ? `${t("copyTo")}: ${S.mail.to}\n` : "") + `${t("copySubject")}: ${S.mail.subject}\n\n${S.mail.body}`;
      const fallback = () => { const el = $("#m-body"); el.focus(); el.select(); toast(t("selectedText")); };
      try { navigator.clipboard.writeText(text).then(() => toast(t("copied")), fallback); } catch { fallback(); }
      break; }
    case "mailreport": saveReport(); break;
    case "zoom": openLightbox(Number(a.dataset.i)); break;
    case "activate": if (e.target.closest("input,label,select")) break; if (S.active !== si) { S.active = si; render(); } break;
    case "rmshot": e.stopPropagation(); S.draft.series[si].shots.splice(Number(a.dataset.j), 1); S.active = si; render(); break;
    case "planned": { e.stopPropagation(); const s = S.draft.series[si], p = seriesStats(s).practiceN, entered = Math.max(0, s.shots.length - p);
      s.planned = Math.max(1, Math.max(s.planned || 0, entered) + Number(a.dataset.d)); if (s.planned < entered) s.shots.length = p + s.planned; S.active = si; render(); break; }
    case "practice": { e.stopPropagation(); const s = S.draft.series[si], old = seriesStats(s).practiceN, p = Math.max(0, Math.min(20, old + Number(a.dataset.d)));
      // shots are kept in firing order: the first p shots are the practice shots
      s.practice = p;
      S.active = si; render(); break; }
    case "addseries": { const d = S.draft; d.series.push(newSeries(d.preset)); S.active = d.series.length - 1; render(); break; }
    case "rmseries": e.stopPropagation(); S.draft.series.splice(si, 1); S.active = Math.min(S.active, S.draft.series.length - 1); render(); break;
    case "rmphoto": { const d = S.draft, id = d.photos.splice(Number(a.dataset.i), 1)[0];
      if (d.addedPhotos.includes(id)) { d.addedPhotos = d.addedPhotos.filter((p) => p !== id); S.assets.delete(id).catch(() => {}); } else d.removedPhotos.push(id);
      render(); break; }
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "club-logo") { S.clubLogo = el.checked; try { localStorage.setItem("scorebook-logo", el.checked ? "club" : "app"); } catch {} render(); return; }
  if (el.id === "ch-file") { const f = el.files && el.files[0]; el.value = ""; if (f) f.text().then(champLoaded, () => toast(t("chBadFile"))); return; }
  if (el.id === "restore-file") { const f = el.files && el.files[0]; el.value = ""; if (f) restoreBackup(f); return; }
  if (el.id === "cam" || el.id === "pick") { const files = Array.from(el.files || []); el.value = ""; if (files.length) addPhotos(files); return; }
  if (S.view !== "edit") return;
  const f = el.dataset.f;
  if (f === "preset") { applyPreset(el.value); render(); }
  else if (f === "x") { S.draft.x = el.value === "1"; if (!S.draft.x) S.draft.series.forEach((s) => (s.shots = s.shots.map((v) => (v === "X" ? 10 : v)))); render(); }
  else if (el.dataset.stype !== undefined) {
    const i = Number(el.dataset.stype), s = S.draft.series[i], prev = seriesStats(s);
    s.type = el.value; delete s.parts;
    if (fixed(s)) { s.target = "A10"; s.practice = 0; const n = seriesStats(s, 1).planned; s.planned = n; if (s.shots.length > n) s.shots.length = n; }
    else { s.target = s.target || "A10"; s.practice = prev.practiceN; s.planned = Math.max(prev.counted || 10, s.shots.length - prev.practiceN); }
    clampShots(s);
    S.active = i; render();
  }
  else if (el.dataset.target !== undefined) {
    const i = Number(el.dataset.target), s = S.draft.series[i];
    s.target = TARGETS[el.value] ? el.value : "A10"; clampShots(s); S.active = i; render();
  }
  else if (el.dataset.tot !== undefined) { const s = S.draft.series[Number(el.dataset.tot)]; s.total = el.value === "" ? null : Number(el.value); setTimeout(render); }
});
document.addEventListener("input", (e) => {
  const m = e.target.dataset && e.target.dataset.m;
  if (m && S.view === "mail") {
    S.mail[m] = e.target.value;
    if (m !== "to") S.mail.edited = true;
    if (m === "to") { try { localStorage.setItem("scorebook-mailto", e.target.value.trim()); } catch {} }
    const a = $("#m-open"); if (a) a.href = mailHref();
    return;
  }
  if (e.target.dataset && e.target.dataset.ch === "url") { S.champ.url = e.target.value; saveChamp(); return; }
  const f = e.target.dataset && e.target.dataset.f;
  if (S.view === "edit" && e.target.dataset && e.target.dataset.tief !== undefined) { S.draft.series[Number(e.target.dataset.tief)].tief = e.target.value; return; }
  if (S.view === "edit" && f && ["date", "desc", "location", "weapon", "conditions", "notes"].includes(f)) S.draft[f] = e.target.value;
});
// The shot keypad steps aside while the total or the Tiefschuss is being typed.
document.addEventListener("focusin", (e) => { if (e.target.dataset && (e.target.dataset.tot !== undefined || e.target.dataset.tief !== undefined)) document.body.classList.add("typing"); });
document.addEventListener("focusout", (e) => { if (e.target.dataset && (e.target.dataset.tot !== undefined || e.target.dataset.tief !== undefined)) document.body.classList.remove("typing"); });
document.addEventListener("toggle", (e) => { if (e.target && e.target.id === "space") { try { localStorage.setItem("scorebook-space-open", e.target.open ? "1" : "0"); } catch {} } }, true);
document.addEventListener("submit", (e) => {
  if (e.target.id !== "kp-form") return;
  e.preventDefault();
  const cs = S.draft.series[S.active], inp = $("#kp-num"), v = Number(inp.value), max = segMax(cs, cs.shots.length);
  if (inp.value === "" || !Number.isInteger(v) || v < 0 || v > max) { toast(t("wholeNumber", max)); inp.focus(); return; }
  addShot(v); render();
  const next = $("#kp-num"); if (next) next.focus();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#lightbox").hidden) $("#lightbox").hidden = true; });
