# Builds the native iPhone app (ios-native/, SwiftUI) and uploads it to
# App Store Connect / TestFlight. Start it by hand: Actions → "iOS app" → Run workflow.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID     10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID        App Store Connect API key ID
#   ASC_ISSUER_ID     App Store Connect API issuer ID
#   ASC_KEY_P8        contents of the downloaded AuthKey_XXXX.p8 file
# The API key needs the "Admin" role so Xcode can create the signing
# certificate and profile automatically. The app must exist in App Store
# Connect with bundle ID io.github.mcas.schiessbuch.
name: iOS app

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac type (macos-15-intel when the Apple-silicon Macs are busy)"
        default: macos-26
        type: choice
        options: [macos-26, macos-15-intel, macos-15]

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    # Apple requires apps uploaded to App Store Connect to be built with Xcode 26 or later.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 26 ]; then echo "::error::This Mac has no Xcode 26; Apple needs Xcode 26 or later. Run again on macos-26."; exit 1; fi

      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Generate Xcode project
        working-directory: ios-native
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate

      - name: Build and upload to TestFlight
        working-directory: ios-native
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          RUN: ${{ github.run_number }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")

          # Archive unsigned: a development signature would need a registered device.
          # The export below signs with an App Store distribution certificate instead.
          xcodebuild -project MySchiessbuch.xcodeproj -scheme MySchiessbuch -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="2.0.$RUN" CURRENT_PROJECT_VERSION="$RUN" archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          echo "Uploaded version 2.0.$RUN ($RUN). It appears in TestFlight after Apple's processing (usually 5–30 minutes)."
