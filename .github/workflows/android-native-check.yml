# Test build of the native Android app (android-native/) on the development branch.
# Compiles a debug app, runs it in the Android emulator with sample data and publishes
# screenshots to the native-android-screenshots branch. Nothing is signed or released.
name: Android native check

on:
  push:
    branches: [native]
    paths: ["android-native/**", ".github/workflows/android-native-check.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-native-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug app
        working-directory: android-native
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log | grep -E "^e: |^w: .*\.kt|error:|BUILD (SUCCESSFUL|FAILED)|What went wrong" || true
          grep -q "BUILD SUCCESSFUL" build.log

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in the emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash android-native/ci/screenshots.sh

      - name: Publish screenshots to the native-android-screenshots branch
        if: always()
        working-directory: android-native
        run: |
          mkdir -p shots
          grep -E "^e: |^w: |What went wrong|BUILD" build.log > shots/build-summary.log 2>/dev/null || true
          cp build.log shots/ 2>/dev/null || true
          cd shots
          git init -q -b native-android-screenshots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" native-android-screenshots
