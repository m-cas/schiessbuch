# Builds the Android app and publishes the installable APK as a GitHub Release.
# Download link for the newest version:
#   https://github.com/m-cas/schiessbuch/releases/latest/download/MySchiessbuch.apk
# (Schiessbuch.apk is published too, so the earlier link keeps working.)
#
# Signing: add these repository secrets (Settings → Secrets and variables → Actions)
#   ANDROID_KEYSTORE_BASE64   the .jks keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them only a test build (debug-signed) is made and attached to the
# workflow run; it is not published as a release.
name: Android app

# Started by hand only (Actions → "Android app" → Run workflow), so no build
# runs without an explicit decision.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare Android project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run android

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../MySchiessbuch.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../MySchiessbuch.apk
          fi

      - name: Copy under the earlier file name
        run: cp MySchiessbuch.apk Schiessbuch.apk

      - uses: actions/upload-artifact@v6
        with:
          name: MySchiessbuch-android-${{ github.run_number }}
          path: MySchiessbuch.apk

      - name: Publish release
        # only signed builds become a release; unsigned test builds stay an artifact
        if: steps.key.outputs.file != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-${{ github.run_number }}
          name: MySchiessbuch Android 1.0.${{ github.run_number }}
          body: |
            Android app, version 1.0.${{ github.run_number }}.
            Install: open this page on the phone, tap **MySchiessbuch.apk** and allow installing apps from this source when asked.
          files: |
            MySchiessbuch.apk
            Schiessbuch.apk
          make_latest: true
