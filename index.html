<style>
/* Layout: one narrow phone column like a range scorebook; sticky top bar, cards only for sessions and the keypad. */
:root {

  --ser: #8f9a91;
  --y0: #2c5a38; --y1: #b0362c; --y2: #2f6db3; --y3: #a87a12; --y4: #6b4fa3; --y5: #3d8a8f;
  --display: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
  --body: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111512; --surface: #1a201b; --sunken: #232a24; --ink: #e8ece6; --muted: #9aa49a;
    --line: #2f3830; --accent: #7fbf8c; --accent-ink: #0f1a12; --accent-soft: #24382a;
    --ring: #e8ece6; --danger: #f08a80; --danger-soft: #3a2220; --gold: #e2b54a; --ser: #7b867c; --y0: #7fbf8c; --y1: #f08a80; --y2: #7fb0ea; --y3: #e2b54a; --y4: #b9a1e6; --y5: #7cc8cc; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111512; --surface: #1a201b; --sunken: #232a24; --ink: #e8ece6; --muted: #9aa49a;
  --line: #2f3830; --accent: #7fbf8c; --accent-ink: #0f1a12; --accent-soft: #24382a;
  --ring: #e8ece6; --danger: #f08a80; --danger-soft: #3a2220; --gold: #e2b54a; --ser: #7b867c; --y0: #7fbf8c; --y1: #f08a80; --y2: #7fb0ea; --y3: #e2b54a; --y4: #b9a1e6; --y5: #7cc8cc; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-size: 15px; overscroll-behavior-y: none; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

.bar { position: sticky; top: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 96px; display: grid; gap: 10px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.chips.disc .chip:last-child { border-radius: 0 9px 9px 0; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); }
.stat { padding: 10px 0 12px; display: grid; gap: 2px; }

.stat .v { font-size: 34px; font-weight: 600; line-height: 1; }

.trend-toggle { width: 100%; border: 0; background: transparent; padding: 0; color: inherit; text-align: left; display: flex !important; justify-content: space-between; align-items: center; min-height: 28px; cursor: pointer; }

.trend { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 4px 2px 6px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
.legend b { font-variant-numeric: tabular-nums; }
.legend.chartkey { color: var(--muted); font-size: 12px; padding-top: 2px; }
.tiefrow { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.tiefrow label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.tiefrow input { width: 96px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-height: 44px; font-size: 18px; font-family: var(--display); font-weight: 600; text-align: center; }
.ts { font-size: 12px; color: var(--muted); font-family: var(--body); font-weight: 500; }
.slist { display: grid; gap: 2px; justify-items: end; font-size: 20px; font-weight: 700; line-height: 1.15; }
.slist small { font-size: 12px; color: var(--muted); font-weight: 500; }
.trend svg { display: block; width: 100%; height: auto; }
.trend-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

.list { display: grid; gap: 10px; }
.list { gap: 8px; }
.list-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 2px; padding-top: 10px; border-top: 6px solid var(--sunken); }
.list-h h2 { font-family: var(--display); font-size: 26px; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.ygroup { display: grid; gap: 8px; }
.yhead { display: flex; align-items: baseline; gap: 10px; border: 0; border-bottom: 2px solid var(--ink); background: transparent; padding: 6px 2px; min-height: 44px; text-align: left; }
.yname { font-family: var(--display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ycount { color: var(--muted); font-size: 13px; font-weight: 600; background: var(--sunken); border-radius: 999px; padding: 2px 10px; align-self: center; }
.ychev { margin-left: auto; }
.ychev { align-self: center; color: var(--muted); transition: transform .15s; }
.ygroup.open .ychev { transform: rotate(180deg); }
.ylist { display: grid; gap: 8px; }
.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sess.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.srow { display: flex; align-items: stretch; }
.srow-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 12px 4px 12px 14px; min-height: 52px; text-align: left; }
.sdate { flex: none; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.stitle { min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow-chev { flex: none; width: 48px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.srow-chev svg { transition: transform .15s; }
.sess.open .srow-chev svg { transform: rotate(180deg); }
.sess .card { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; }
.thumb { width: 64px; height: 64px; border-radius: 10px; background: var(--sunken); object-fit: cover; display: grid; place-items: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.card .meta { min-width: 0; display: grid; gap: 2px; }
.card .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .s { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score { text-align: right; }
.score .big { font-size: 30px; font-weight: 700; line-height: 1; }

.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg3 button { border: 0; background: transparent; min-height: 44px; font-weight: 600; font-size: 15px; padding: 0 6px; }
.seg3 button + button { border-left: 1px solid var(--line); }
.seg3 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip.multi[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.multi[aria-pressed="true"]::before { content: "✓ "; }
.filters { display: grid; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.frow { display: grid; gap: 6px; min-width: 0; }
.frow + .frow { border-top: 1px dashed var(--line); padding-top: 10px; }
.cat-tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-top: 4px; }
.pct-pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-top: 4px; }

.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 28px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }

.note { font-size: 13px; color: var(--muted); }
.warn { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--danger-soft); color: var(--danger); }

/* Editor */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.logo { width: 44px; height: 44px; object-fit: contain; border-radius: 10px; flex: none; display: block; }
.logobtn { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.logobtn { position: relative; flex: none; border: 0; padding: 0; background: transparent; border-radius: 10px; }
.logobtn .gear { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); display: grid; place-items: center; }
.logobtn .alert-dot { position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--danger); border: 2px solid var(--bg); }
.settings { display: grid; gap: 22px; }
.settings h2 { font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 10px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.settings .langsw { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }

.switchrow { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.switchrow .lbl { display: grid; gap: 2px; min-width: 0; }

.switchrow img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; flex: none; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.field input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; height: 44px; line-height: 22px; text-align: left; }
.field input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
.field input[type="date"]::-webkit-calendar-picker-indicator { margin: 0; }
.field select { min-width: 0; max-width: 100%; text-overflow: ellipsis; }
.field label, .field .flabel { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; font-size: 16px; }
.field textarea { min-height: 72px; resize: vertical; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.row2.date-row { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); }
@media (max-width: 380px) { .row2 { grid-template-columns: 1fr; } }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.section-h h2 { font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; margin: 0; }

.series { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.series.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.series-head { display: flex; align-items: center; gap: 8px; }

.shots { display: flex; flex-wrap: wrap; gap: 6px; }

.shot.x { background: var(--ring); color: var(--bg); }

.seg { display: grid; gap: 4px; }
.seg-l { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.series .field select { min-height: 40px; font-size: 15px; padding: 8px 10px; }
.series-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

.manual { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.manual input { width: 76px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); font-size: 16px; }

.keypad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-top: 8px; box-shadow: 0 -6px 20px rgba(0,0,0,.08); }
.keypad-in { max-width: 640px; margin: 0 auto; display: grid; gap: 8px; }
.keypad-top span:first-child { white-space: nowrap; }
.keypad-top span:last-child { text-align: right; }

.shot { font-variant-numeric: tabular-nums; }

.series .lock { margin: 0; font-size: 13px; color: var(--muted); }
.champ { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); min-width: 0; }

.ch-tabs { justify-self: start; }

.ch-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; }

.ch-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ch-item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 8px; }
.ch-main { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: end; }

  return f(n / 1024 ** 3, 1) + " GB";
}
async function updateStorage() {
  try {
    let bytes = 0, count = 0;
    await new Promise((res, rej) => {
      const tx = IDB.db.transaction("photos", "readonly"), r = tx.objectStore("photos").openCursor();
      r.onsuccess = () => { const c = r.result; if (c) { const v = c.value; bytes += v.size || (v.data && v.data.byteLength) || (v.blob && v.blob.size) || 0; count++; c.continue(); } };
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
    const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : {};
    // a backup holds the photos as text (about 4/3 of their size) plus the session data
    const backup = Math.round(bytes * 4 / 3) + JSON.stringify(S.sessions).length;
    S.store = { photoBytes: bytes, photoCount: count, usage: est.usage, quota: est.quota, backup };
  } catch {}
  if (S.view === "list" || S.view === "settings") render();
}
async function refresh() {
  const all = (await dbAll()).map(normSession);
  S.sessions = all.sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
  if (S.current) S.current = S.sessions.find((x) => x.id === S.current.id) || null;
  if (S.view === "detail" && !S.current) S.view = "list";
  for (const id of [...S.picked]) if (!S.sessions.some((x) => x.id === id)) S.picked.delete(id);
  updateStorage();
}

async function makeBackup(mail) {

    if (mail && NATIVE) {

    } else if (mail) {
      // Some phones only attach common file types, so fall back to .txt; Restore accepts both.
      const cands = [new File([json], name + ".json", { type: "application/json" }), new File([json], name + ".txt", { type: "text/plain" })];
      const f = navigator.share && navigator.canShare ? cands.find((c) => navigator.canShare({ files: [c] })) : null;
      if (f) {

        catch (e) { if (!(e && e.name === "AbortError")) throw e; }
      } else { await shareOrSave(name + ".json", json, "application/json"); toast(t("backupNoShare")); }

async function bulkDelete() {
  const ids = [...S.picked], n = ids.length;
  try {
    for (const id of ids) {
      const x = S.sessions.find((s) => s.id === id); if (!x) continue;
      await dbDel(id);
      for (const pid of x.photos || []) { try { await photoDel(pid); } catch {} }
    }
    S.picked.clear(); S.selecting = false; S.bulkAsk = false;
    await refresh(); render(); toast(t("bulkDeleted", n));
  } catch { S.bulkAsk = false; await refresh(); render(); toast(t("delFail")); }

async function restoreBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== "scorebook" || !Array.isArray(data.sessions)) return toast(t("badBackup"));
    let missing = 0;
    for (const p of data.photos || []) { try { await photoPut(dataUrlToBlob(p.data), p.id); } catch { missing++; } }
    for (const x of data.sessions) if (x && x.id && Array.isArray(x.series)) await dbPut(x);
    if (data.championship && typeof data.championship === "object" && (data.championship.current || (data.championship.history || []).length)) { S.champ = { url: data.championship.url || S.champ.url, current: data.championship.current || null, history: data.championship.history || [] }; saveChamp(); }
    clearPhotoCache();
    await refresh(); render(); toast(t("restored", data.sessions.length) + (missing ? " · " + t("photosMissing", missing) : ""));
  } catch { toast(t("restoreFail")); }
}

// Landscape on a phone, or a large screen: wider layout, wider chart, more on each row.
const WIDE_Q = matchMedia("(orientation: landscape) and (min-width: 640px)");
const isWide = () => WIDE_Q.matches;
WIDE_Q.addEventListener("change", () => { if (S.view === "list") render(); });
const CHEV = `<svg class="tchev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function trendView(rows) {
  const by = new Map();
  for (const x of rows) { const y = (x.date || "").slice(0, 4); if (!/^\d{4}$/.test(y)) continue; if (!by.has(y)) by.set(y, []); by.get(y).push(x); }
  const years = [...by.keys()].sort().reverse().slice(0, 6);
  if (!years.length) return "";
  const doy = (d) => { const dt = new Date(d + "T12:00:00"), y0 = new Date(dt.getFullYear(), 0, 1), y1 = new Date(dt.getFullYear() + 1, 0, 1); return (dt - y0) / (y1 - y0); };
  const series = years.map((y, ci) => ({ y, ci, pts: by.get(y).slice().sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.createdAt || 0) - (b.createdAt || 0)).map((x) => { const vals = x.series.map(seriesNorm).filter((v) => v !== null); if (!vals.length) return null; return { f: doy(x.date), v: Math.round((vals.reduce((a, v) => a + v, 0) / vals.length) * 10) / 10, vals }; }).filter(Boolean) })).filter((s) => s.pts.length);
  if (!series.length) return "";
  const all = series.flatMap((s) => s.pts.flatMap((p) => p.vals));
  const mn = Math.min(...all), mx = Math.max(...all);
  const pad = Math.max((mx - mn) * 0.12, mx * 0.02, 1);
  const lo = Math.max(0, Math.floor(mn - pad)), hi = Math.min(100, Math.ceil(mx + pad));
  const W = isWide() ? 1100 : 600, H = 250, pl = 46, pr = 14, pt = 14, pb = 34;
  const sx = (f) => pl + f * (W - pl - pr), sy = (v) => pt + ((hi - v) * (H - pt - pb)) / (hi - lo || 1);
  const ticks = [lo, Math.round((lo + hi) / 2), hi];
  const months = Array.from({ length: 12 }, (_, m) => new Date(2001, m, 15).toLocaleDateString(t("locale"), { month: "narrow" }));
  const grid = months.map((_, m) => `<line x1="${sx(m / 12).toFixed(1)}" x2="${sx(m / 12).toFixed(1)}" y1="${pt}" y2="${H - pb}" stroke="var(--line)" stroke-width="1" opacity=".6"/>`).join("")
    + months.map((lab, m) => `<text x="${sx((m + 0.5) / 12).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="15" fill="var(--muted)" font-family="-apple-system, system-ui, sans-serif">${esc(lab)}</text>`).join("")
    + ticks.map((v) => `<line x1="${pl}" x2="${W - pr}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${(sy(v) + 5).toFixed(1)}" text-anchor="end" font-size="15" fill="var(--muted)" font-family="-apple-system, system-ui, sans-serif">${v}</text>`).join("");
  const bars = series.map((s) => s.pts.filter((p) => p.vals.length > 1).map((p) => {
    const x = sx(p.f).toFixed(1), lo2 = Math.min(...p.vals), hi2 = Math.max(...p.vals);
    return `<line x1="${x}" x2="${x}" y1="${sy(hi2).toFixed(1)}" y2="${sy(lo2).toFixed(1)}" stroke="var(--ser)" stroke-width="3" stroke-linecap="round"/>`
      + p.vals.map((v) => `<circle cx="${x}" cy="${sy(v).toFixed(1)}" r="3.5" fill="var(--surface)" stroke="var(--ser)" stroke-width="2"/>`).join("");
  }).join("")).join("");
  const anyBars = series.some((s) => s.pts.some((p) => p.vals.length > 1));
  const lines = series.slice().reverse().map((s) => {
    const c = `var(--y${s.ci})`, w = s.ci === 0 ? 3.5 : 2.5;
    const d = s.pts.map((p, i) => `${i ? "L" : "M"}${sx(p.f).toFixed(1)},${sy(p.v).toFixed(1)}`).join("");
    return (s.pts.length > 1 ? `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>` : "")
      + s.pts.map((p) => `<circle cx="${sx(p.f).toFixed(1)}" cy="${sy(p.v).toFixed(1)}" r="${s.ci === 0 ? 5 : 4}" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  }).join("");
  const legend = series.map((s) => { const a = s.pts.reduce((x, p) => x + p.v, 0) / s.pts.length;
    return `<span><i style="background:var(--y${s.ci})"></i><b>${s.y}</b> <span class="note">${t("yearAvg", fmtScore(a), s.pts.length)}</span></span>`; }).join("");
  if (!S.chartOpen) return `<div class="trend closed"><button class="trend-head trend-toggle" data-act="chart" aria-expanded="false"><span class="eyebrow">${t("trendYears")}</span>${CHEV}</button></div>`;
  return `<div class="trend"><button class="trend-head trend-toggle" data-act="chart" aria-expanded="true"><span class="eyebrow">${t("trendYears")}</span>${CHEV}</button>

// 2×10 single shots: each group of 10 has its own subtotal next to the overall total.
const hasGroups = (s) => stype(s) === "s2x10" || (composite(s) && new Set(s.parts.filter((q) => q.k !== "practice").map((q) => q.g)).size > 1);
function groupTotals(s) {
  if (!hasGroups(s)) return null;
  if (composite(s)) {
    const segs = segments(s), out = [];
    for (const g of segs) {
      if (g.k === "practice") continue;
      let r = out.find((o) => o.n === g.g); if (!r) { r = { n: g.g, sum: 0, max: 0, shots: 0 }; out.push(r); }
      const v = s.shots.slice(g.start, g.start + g.n);
      r.sum += v.reduce((a, x) => a + shotVal(x), 0); r.max += g.n * g.max; r.shots += v.length;
    }
    return out;
  }
  return segments(s).map((g, n) => ({ n: n + 1, sum: s.shots.slice(g.start, g.start + g.n).reduce((a, v) => a + shotVal(v), 0), max: g.n * (g.max || tmax(s)), shots: Math.max(0, Math.min(g.n, s.shots.length - g.start)) }));
}
const groupLine = (s) => { const gt = groupTotals(s); return gt && s.shots.length ? gt.map((g) => `${t("groupN", g.n)}: ${g.sum}/${g.max}`).join(" · ") : ""; };
// The group a segment belongs to (null for practice shots or series without groups).
function groupOf(s, segs, i) {
  const gt = groupTotals(s); if (!gt || segs[i].k === "practice") return null;
  return composite(s) ? gt.find((o) => o.n === segs[i].g) || null : gt[i] || null;
}
// Subtotal after the last scoring part of each group.
const groupEnds = (segs, i) => !segs.slice(i + 1).some((h) => h.k !== "practice" && (h.g === undefined || h.g === segs[i].g));
function shotsText(s) {
  const segs = segments(s), gt = groupTotals(s);
  return segs.map((g, n) => { const v = s.shots.slice(g.start, g.start + g.n); if (!v.length) return ""; if (g.k === "practice") return `(${v.join(" ")})`; const gr = groupOf(s, segs, n); return v.join(" ") + (gt && gr && (composite(s) ? groupEnds(segs, n) : true) ? ` [${gr.sum}]` : ""); }).filter(Boolean).join(" · ");
}

function csvRows(text, sep) {

  for (let i = 0; i < text.length; i++) {

    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;

function champDisc(v) {

  if (["p50", "pistole50m", "pistol50m", "50m"].includes(s)) return "p50";
  if (["ap10", "lp10", "luftpistole10m", "airpistol10m", "luftpistole"].includes(s)) return "ap10";
  if (["ag10", "lug10", "lg10", "luftgewehr10m", "airrifle10m", "airgun10m", "luftgewehr"].includes(s)) return "ag10";
  if (["other", "andere", "anderes"].includes(s)) return "other";

function champDate(v) {
  const s = String(v || "").trim(); let m;

// Series are separated by "!"; parts joined by "+" form ONE series (each part its own group with a subtotal).

function champPart(raw, preset) {
  const tk = raw.toLowerCase();
  if (SERIES_TYPES[tk] && tk !== "custom" && formatsFor(preset).includes(tk)) return { code: tk, segs: SERIES_TYPES[tk].segs.map((g) => ({ k: g.k, n: g.n, t: g.tgt || "A10" })) };

function champSeries(text, preset, warn) {
  const out = [];
  for (const group of String(text || "").split("!").map((x) => x.trim()).filter(Boolean)) {
    const parts = group.split("+").map((x) => x.trim()).filter(Boolean).map((raw) => { const r = champPart(raw, preset); if (!r) warn(raw); return r; }).filter(Boolean);
    if (!parts.length) continue;
    if (parts.length === 1 && parts[0].code) { out.push({ type: parts[0].code, target: "A10", planned: seriesStats({ type: parts[0].code, shots: [] }, 1).planned, practice: 0 }); continue; }
    if (parts.length === 1) { const c = parts[0].custom; out.push({ type: "custom", target: c.t, planned: c.n, practice: c.p }); continue; }
    const segs = parts.flatMap((r, i) => r.segs.map((q) => ({ ...q, g: i + 1 })));

function parseChamp(text) {

  const rows = csvRows(text, sep);
  if (rows.length < 2) throw new Error(t("chNoRows"));
  const head = rows[0].map((h) => h.toLowerCase().replace(/[^a-zäöü]/g, ""));
  const col = {}; for (const [k, names] of Object.entries(CH_COLS)) { const i = head.findIndex((h) => names.includes(h)); if (i >= 0) col[k] = i; }
  if (col.title === undefined || col.disc === undefined) throw new Error(t("chNeedCols"));
  const warnings = [], items = [], ids = new Set();
  let year = null, name = "";
  rows.slice(1).forEach((r, n) => {
    const line = n + 2, get = (k) => (col[k] !== undefined ? r[col[k]] || "" : "");
    const title = get("title"); if (!title) return;
    const preset = champDisc(get("disc"));

    const y = get("year").match(/\d{4}/); if (y && !year) year = Number(y[0]);

    const series = champSeries(get("series"), preset, (tok) => warnings.push(t("chBadSeries", line, tok)));

  });

function champUrl(u) {

      <div class="actions"><button class="btn primary" data-act="chapply">${t("chLoad")}</button><button class="btn ghost" data-act="chaskno">${t("cancel")}</button></div></div>` : "";
  return `<div class="champ"><h2 class="ch-settings-h">${t("chSettings")}</h2>${ask}
    <section class="ch-load"><label for="ch-url" class="eyebrow">${t("chUrl")}</label>
      <div class="ch-urlrow"><input id="ch-url" type="url" inputmode="url" autocomplete="off" placeholder="https://…/meisterschaft.csv" value="${esc(ch.url)}" data-ch="url">
      <button class="btn primary" data-act="chfetch" ${S.champBusy ? "disabled" : ""}>${S.champBusy ? t("chLoading") : cur ? t("chReload") : t("chLoad")}</button></div>
      <div class="actions"><label class="btn ghost" for="ch-file">${t("chFromFile")}</label><input id="ch-file" class="visually-hidden" type="file" accept=".csv,.txt,text/csv,text/plain">
      <a class="btn ghost" href="meisterschaft-beispiel.csv" target="_blank" rel="noopener">${t("chExample")}</a></div>
      ${S.champWarn && S.champWarn.length ? `<details class="warn"><summary>${t("chWarnN", S.champWarn.length)}</summary>${S.champWarn.map((w) => `<div>${esc(w)}</div>`).join("")}</details>` : ""}
      ${cur ? `<p class="note">${t("chLoadedInfo", cur.year, cur.items.length)}</p>` : ""}
      <p class="note">${t("chOnlyOne")}</p></section></div>`;
}
// championship titles stay on one line: the font shrinks step by step (down to 11 px) until the title fits
function fitChampTitles() {
  for (const el of document.querySelectorAll(".ch-fit")) {
    el.style.fontSize = "";
    const r = document.createRange(); r.selectNodeContents(el);
    const full = () => r.getBoundingClientRect().width;   // width of the whole text, also when it is cut off
    let px = parseFloat(getComputedStyle(el).fontSize);
    while (full() > el.clientWidth + 0.5 && px > 11) { px -= 0.5; el.style.fontSize = px + "px"; }
  }
}
window.addEventListener("resize", () => { if (S.view === "champ") fitChampTitles(); });
function champView() {
  const cur = S.champ.current;
  const cog = `<button class="ch-cog" data-act="champset" aria-label="${t("chSettings")}" title="${t("chSettings")}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L9 21h4l.3-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>`;
  if (!cur) return `<div class="champ"><div class="ch-top">${cog}<h2>${t("chTitle")}</h2></div>
    <div class="empty"><h2>${t("chEmptyH")}</h2><p>${t("chEmptyCog")}</p><button class="btn primary" data-act="champset">${t("chSettings")}</button></div></div>`;
  const done = cur.items.filter((x) => champSession(x)).length;
  return `<div class="champ"><div class="ch-top">${cog}<div class="ch-head"><div><span class="eyebrow">${t("chTitle")} ${cur.year}</span><h2 class="ch-fit">${esc(cur.name)}</h2></div></div></div>
    <div class="ch-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${cur.items.length}" aria-valuenow="${done}"><span style="width:${cur.items.length ? (done / cur.items.length) * 100 : 0}%"></span></div><p class="note num ch-prog">${t("chProgress", done, cur.items.length)}</p>
    <ul class="ch-list">${cur.items.map(champItemView).join("")}</ul></div>`;
}

/* ---------- help page (same text as the iPhone and Android apps) ---------- */
const HELP = {"de": [{"t": "Erste Schritte", "p": ["Oben stehen drei Schaltflächen: Meisterschaft, Auswählen und Neue Übung (auf schmalen Telefonen gekürzt). «Neue Übung» öffnet ein Menü: «Manuell erfassen», «Foto aufnehmen» oder «Foto laden» (siehe «Ausdruck fotografieren»). Beim manuellen Erfassen wählst du Datum, Disziplin und Kategorie (Training, Meisterschaft oder Andere). Beschreibung, Schiessstand, Waffe und Bedingungen sind freiwillig.", "Die Disziplin bestimmt, welche Serienformate es gibt: Gewehr 300m (G300), Pistole 25m (P25), Pistole 50m (P50), Luftpistole 10m (LP10), Luftgewehr 10m (LG10) und Andere.", "Eine neue Übung übernimmt Disziplin, Kategorie, Schiessstand und Waffe der letzten Übung."]}, {"t": "Schüsse erfassen", "p": ["Jede Übung hat eine oder mehrere Serien. Die aktive Serie ist grün umrandet; tippe auf eine Serie, um sie zu aktivieren. Mit «Serie hinzufügen» kommt eine weitere dazu.", "Tippe die Werte im Tastenfeld unten ein. Ist eine Serie voll, springt die Eingabe zur nächsten. ⌫ entfernt den letzten Schuss; ein erfasster Schuss lässt sich auch direkt antippen, um ihn zu entfernen.", "X (Innenzehner, zählt 10) gibt es bei Pistole 25m und 50m. Auf der A100-Scheibe tippst du den Wert ein und wählst «Hinzufügen».", "Probeschüsse stehen in Klammern und zählen nie. Bei eigenen Serien stellst du die Anzahl Probe- und gezählter Schüsse mit − und + ein; mehr Schüsse als gewählt lassen sich nicht erfassen.", "«oder Total»: Statt einzelner Schüsse nur das Serientotal eintragen. Total und Einzelschüsse schliessen sich aus: Mit Total sind die Schüsse gesperrt, mit Schüssen das Total. Feld leeren, um zu wechseln.", "Tiefschuss: freiwillig pro Serie, ganze Zahl von 0 bis 100.", "Während du Total oder Tiefschuss eintippst, verschwindet das Tastenfeld."]}, {"t": "Ausdruck fotografieren", "p": ["Mit «Foto aufnehmen» oder «Foto laden» liest die App den Resultatstreifen des Schiessstands: Pg-Streifen der Nadeldrucker (auch zwei Kopien nebeneinander) und Thermostreifen «Scheibe» mit Probeschüssen, Teiltotalen und 100er-Werten.", "Danach öffnet sich eine neue Übung mit Datum, Schüssen und Tiefschuss; das Foto wird als Scheibenfoto gespeichert. Bekannte 300m-Programme erhalten ihr Format (z. B. 2 Probe + 5 Einzel + Serien zu 2 und 3, Feldschiessen), sonst entsteht eine eigene Serie.", "Oben steht, ob alle gedruckten Totale zu den gelesenen Schüssen passen, oder was zu prüfen ist (z. B. eine Serie, deren Summe nicht stimmt, oder ein unlesbarer Schuss). Kontrolliere die Werte vor dem Speichern.", "Tipps: Streifen flach hinlegen, Spiegelungen und starke Schatten vermeiden, der Druck soll das Bild möglichst ausfüllen. Unscharfe Fotos lassen sich nicht lesen. Auf iPhone und Android wird das Foto auf dem Gerät gelesen; die Webversion braucht beim ersten Mal eine Internetverbindung."]}, {"t": "Serienformate", "p": ["G300: 10 Schüsse A10 · 2×10 Einzelschüsse A10 (zwei Teiltotale, ein Gesamttotal) · 10 Schüsse mit 6 Einzel, 4 Serie · 12 Schüsse mit 2 Probe, 6 Einzel, 4 Serie · 12 Schüsse mit 2 Probe, 5 Einzel, Serien zu 2 und 3 · OP (20 Schüsse A5/B4) · Feldschiessen (18 Schüsse B4) · Eigene (Schüsse, Probe und Scheibe A10, A100, B4, B5, A5 wählbar).", "P25 und P50: Standard 5/5/5 · OP 5 Einzel + 5/5/5 · Feldschiessen 3 Einzel + 5/5/5 · Eigene. Immer 0–10.", "LP10 und LG10: 10 Schüsse · 20 Schüsse · Eigene. Immer 0–10."]}, {"t": "Scheibenfotos", "p": ["Unter «Scheiben» nimmst du ein Foto auf oder wählst Bilder aus der Mediathek. Fotos werden auf höchstens 2000 Pixel verkleinert, damit sie wenig Platz brauchen und jedes Loch lesbar bleibt.", "In der Übung tippst du ein Foto an, um es gross anzusehen und zu zoomen."]}, {"t": "Startseite und Grafik", "p": ["Oben filterst du nach einer Disziplin (Alle, G300, P25 …) und nach einer oder mehreren Kategorien. Statistik, Grafik und Liste zeigen nur die gewählten Übungen.", "Ø Serie und Beste Serie: Jede Serie wird auf 10 Schüsse auf A10 umgerechnet (0–100). So lassen sich 20 Schüsse, B4 oder A100 vergleichen.", "Die Grafik zeigt eine Linie pro Kalenderjahr (Januar bis Dezember) mit dem Durchschnitt jeder Übung. Hat eine Übung mehrere Serien, zeigt ein grauer Balken mit Punkten die einzelnen Serien.", "Ein Tipp auf «Resultat nach Jahr» klappt die Grafik ein oder aus (mit dem Hinweis zur Umrechnung); die App merkt sich die Wahl.", "Die Übungen sind nach Jahr gruppiert; tippe auf ein Jahr, um es auf- oder zuzuklappen.", "Tippe auf eine Übung, um sie zu öffnen. Der Pfeil rechts zeigt eine Vorschau mit Foto, Details und Resultaten; ein Tipp darauf öffnet die Übung ebenfalls.", "Quer gehalten zeigt die App mehr: Die Grafik nutzt die ganze Breite, und jede Zeile zeigt zusätzlich Disziplin und Serienresultate.", "«Auswählen»: mehrere Übungen markieren, dann löschen, drucken (alle gewählten Übungen übersichtlich auf A4, mit Serien und Notizen; die App fragt, ob bis zu vier Fotos pro Übung mitgedruckt werden) oder per E-Mail senden (mit Text und Scheibenfotos)."]}, {"t": "Meisterschaft", "p": ["Die Schaltfläche «Meisterschaft» oben öffnet die Seite Meisterschaft mit allen Übungen des Jahres. Das Zahnrad oben links öffnet «Meisterschaft einrichten»: Dort gibst du die Adresse der CSV-Datei des Vereins ein und tippst «Laden» (später «Neu laden»), oder du wählst «Datei wählen».", "Das runde + unten rechts bei einem Eintrag legt die Übung mit Disziplin, Serien, Beschreibung und Kategorie Meisterschaft an und öffnet sie. Der Eintrag wird danach grau mit Häkchen und Resultat angezeigt.", "Das ✕ unten rechts gibt einen erledigten Eintrag wieder frei; du wählst, ob die erfasste Übung bleibt oder gelöscht wird.", "Hat ein Eintrag ein Datum, zeigt ein gelbes Warndreieck, dass es in höchstens drei Wochen so weit ist. Ist das Datum vorbei, stehen Datum und + rot; beim Antippen fragt die App, ob du die überfällige Übung trotz Abzug erfassen willst.", "Es wird nur eine Meisterschaft gespeichert. Eine Datei eines anderen Jahres ersetzt sie (die App fragt vorher); erfasste Übungen bleiben immer erhalten. Beim Neuladen desselben Jahres bleiben aktivierte Einträge aktiviert.", "Dateiformat: eine Kopfzeile, dann eine Zeile pro Übung mit den Spalten id;jahr;meisterschaft;titel;disziplin;serien;datum;schiessstand;notizen. Eine Beispieldatei gibt es in der Web-Version.", "Spalte serien: ! trennt Serien, + verbindet Teile zu einer einzigen Serie. c:10:a10!c:5:a10 ergibt zwei Serien (10 und 5 Schüsse) mit je eigenem Total; c:6:a10+c:4:a10 ergibt eine Serie mit den Gruppen 6 und 4, jede mit Teiltotal, und einem Gesamttotal. c:10:a10:3 bedeutet 3 Probeschüsse und 10 gezählte Schüsse.", "In der Liste steht pro Serie nur die Aufteilung mit allfälligen Probeschüssen, z. B. «3 Probe + 10 + 10» oder «10 | 5»."]}, {"t": "Daten und Backup", "p": ["Alle Übungen und Fotos bleiben nur auf diesem Gerät. Nichts wird hochgeladen.", "Speichere ab und zu ein Backup (Einstellungen → «Backup speichern» oder «Backup per E-Mail»), und immer vor einem Telefonwechsel. Mit «Backup wiederherstellen» lädst du es wieder; Fotos und Meisterschaft sind enthalten.", "Ist das Backup grösser als 20 MB, erscheint ein rotes Warndreieck: zu gross für die meisten E-Mail-Dienste. Dann mit «Backup speichern» z. B. in Dropbox oder Google Drive ablegen.", "«Als CSV exportieren» erstellt eine Tabelle mit einer Zeile pro Serie, für Excel oder Google Sheets."]}, {"t": "Einstellungen", "p": ["Tippe oben links auf das Logo. Dort wählst du die Sprache (Deutsch, Français, Italiano oder English), Hilfe, Export und Backup."]}], "en": [{"t": "Getting started", "p": ["Three buttons sit at the top: Championship, Select and New Session (shortened on narrow phones). New Session opens a menu: Enter manually, Take picture or Load picture (see Photo of the printout). When entering manually, choose the date, discipline and category (Training, Championship or Other). Description, range, weapon and conditions are optional.", "The discipline decides which series formats are offered: Rifle 300m (G300), Pistol 25m (P25), Pistol 50m (P50), Air Pistol 10m (LP10), Air Rifle 10m (LG10) and Other.", "A new session takes the discipline, category, range and weapon of your last session."]}, {"t": "Entering shots", "p": ["Each session has one or more series. The active series has a green border; tap a series to make it active. Add series adds another one.", "Tap the values on the keypad at the bottom. When a series is full, entry moves on to the next. ⌫ removes the last shot; you can also tap any entered shot to remove it.", "X (inner ten, counts as 10) is available for Pistol 25m and 50m. On the A100 target, type the value and tap Add.", "Practice shots are shown in brackets and never count. For custom series, set the number of practice and counted shots with − and +; you can't enter more shots than chosen.", "Or total: enter only the series total instead of single shots. Total and single shots exclude each other: with a total the shots are locked, with shots the total is locked. Clear the field to switch.", "Tiefschuss: optional per series, a whole number from 0 to 100.", "While you type a total or Tiefschuss, the keypad steps aside."]}, {"t": "Photo of the printout", "p": ["With Take picture or Load picture the app reads the result strip printed at the range: dot-matrix Pg strips (also two copies side by side) and thermal Scheibe strips with sighters, subtotals and 100-scale values.", "A new session then opens with the date, shots and Tiefschuss filled in; the photo is kept as a target photo. Known 300 m programs get their format (e.g. 2 practice + 5 single + series of 2 and 3, Feldschiessen); anything else becomes a custom series.", "At the top it says whether all printed totals match the shots read, or what to check (e.g. a series whose sum does not match, or a shot that could not be read). Check the values before saving.", "Tips: lay the strip flat, avoid glare and strong shadows, and let the printed area fill the photo. A blurred photo can't be read. On iPhone and Android the photo is read on the device; the web version needs an internet connection the first time."]}, {"t": "Series formats", "p": ["G300: 10 shots A10 · 2×10 single shots A10 (two subtotals, one overall total) · 10 shots with 6 single, 4 in series · 12 shots with 2 practice, 6 single, 4 in series · 12 shots with 2 practice, 5 single, series of 2 and 3 · OP (20 shots A5/B4) · Feldschiessen (18 shots B4) · Custom (choose shots, practice and target A10, A100, B4, B5, A5).", "P25 and P50: Standard 5/5/5 · OP 5 single + 5/5/5 · Feldschiessen 3 single + 5/5/5 · Custom. Always 0–10.", "LP10 and LG10: 10 shots · 20 shots · Custom. Always 0–10."]}, {"t": "Target photos", "p": ["Under Targets, take a photo or pick pictures from your library. Photos are resized to at most 2000 pixels so they take little space while every hole stays readable.", "In a session, tap a photo to see it full screen and zoom."]}, {"t": "Home screen and chart", "p": ["At the top, filter by one discipline (All, G300, P25 …) and by one or more categories. Statistics, chart and list show only the chosen sessions.", "Avg series and Best series: every series is converted to 10 shots on A10 (0–100), so 20 shots, B4 or A100 can be compared.", "The chart shows one line per calendar year (January to December) with the average of each session. When a session has several series, a grey bar with dots shows the single series.", "Tap Score by year to fold the chart (with the note on the conversion) away or show it again; the app remembers the choice.", "Sessions are grouped by year; tap a year to open or close it.", "Tap a session to open it. The arrow on the right shows a preview with photo, details and results; tapping the preview opens the session too.", "Turned sideways, the app shows more: the chart uses the full width, and each row also shows the discipline and series results.", "Select: mark several sessions, then delete them, print them (all chosen sessions laid out on A4 with series and notes; the app asks whether to include up to four photos per session) or send them by email (with text and target photos)."]}, {"t": "Championship", "p": ["The Championship button at the top opens the Championship page with all sessions of the year. The cog at the top left opens Championship settings: enter the address of the club's CSV file and tap Load (later Reload), or use Choose file.", "The round + at the bottom right of an item creates the session with discipline, series, description and category Championship, and opens it. The item then shows greyed out with a tick and its result.", "The ✕ at the bottom right makes a completed item available again; you choose whether the recorded session is kept or deleted.", "When an item has a date, a yellow warning triangle shows that it is three weeks away or less. Once the date has passed, the date and the + show in red; tapping + asks whether to record the overdue session despite the penalty.", "Only one championship is kept. A file for another year replaces it (the app asks first); recorded sessions always stay. Reloading the same year keeps activated items activated.", "File format: a header line, then one line per session with the columns id;jahr;meisterschaft;titel;disziplin;serien;datum;schiessstand;notizen. An example file is in the web version.", "Column serien: ! separates series, + joins parts into one series. c:10:a10!c:5:a10 gives two series (10 and 5 shots), each with its own total; c:6:a10+c:4:a10 gives one series with groups of 6 and 4, each with a subtotal, and one overall total. c:10:a10:3 means 3 practice shots and 10 counted shots.", "The list shows only the grouping of each series with any practice shots, e.g. \"3 practice + 10 + 10\" or \"10 | 5\"."]}, {"t": "Data and backup", "p": ["All sessions and photos stay on this device only. Nothing is uploaded.", "Save a backup now and then (Settings → Save backup or Email backup), and always before changing phones. Restore backup loads it again; photos and the championship are included.", "When the backup is larger than 20 MB, a red warning triangle appears: too large for most email services. Use Save backup and keep it in e.g. Dropbox or Google Drive.", "Export as CSV creates a table with one row per series, for Excel or Google Sheets."]}, {"t": "Settings", "p": ["Tap the logo at the top left. There you choose the language (Deutsch, Français, Italiano or English), help, export and backup."]}], "fr": [{"t": "Premiers pas", "p": ["En haut se trouvent trois boutons : Championnat, Sélectionner et Nouvel exercice (abrégés sur les téléphones étroits). Nouvel exercice ouvre un menu : Saisir manuellement, Prendre une photo ou Charger une photo (voir Photo de l'impression). Pour la saisie manuelle, choisis la date, la discipline et la catégorie (Entraînement, Championnat ou Autre). Description, stand, arme et conditions sont facultatifs.", "La discipline détermine les formats de série proposés : Fusil 300m (F300), Pistolet 25m (P25), Pistolet 50m (P50), Pistolet à air 10m (P10), Carabine à air 10m (C10) et Autre.", "Un nouvel exercice reprend la discipline, la catégorie, le stand et l'arme de ton dernier exercice."]}, {"t": "Saisir les coups", "p": ["Chaque exercice comprend une ou plusieurs séries. La série active a un cadre vert ; touche une série pour l'activer. Ajouter une série en ajoute une autre.", "Touche les valeurs sur le clavier en bas. Quand une série est pleine, la saisie passe à la suivante. ⌫ efface le dernier coup ; tu peux aussi toucher un coup saisi pour l'effacer.", "X (mouche, compte 10) est disponible au pistolet 25m et 50m. Sur la cible A100, tape la valeur puis touche Ajouter.", "Les coups d'essai sont entre parenthèses et ne comptent jamais. Pour les séries libres, règle le nombre de coups d'essai et de coups comptés avec − et + ; tu ne peux pas saisir plus de coups que choisi.", "Ou total : saisis seulement le total de la série au lieu des coups. Total et coups s'excluent : avec un total, les coups sont bloqués ; avec des coups, le total est bloqué. Vide le champ pour changer.", "Coup profond : facultatif par série, un nombre entier de 0 à 100.", "Pendant que tu tapes un total ou un coup profond, le clavier s'efface."]}, {"t": "Photo de l'impression", "p": ["Avec Prendre une photo ou Charger une photo, l'app lit la bande de résultats imprimée au stand : bandes Pg des imprimantes matricielles (aussi deux copies côte à côte) et bandes thermiques Scheibe avec coups d'essai, sous-totaux et valeurs au 100.", "Un nouvel exercice s'ouvre ensuite avec la date, les coups et le coup profond ; la photo est conservée comme photo de cible. Les programmes 300m connus reçoivent leur format (p. ex. 2 d'essai + 5 coup par coup + séries de 2 et 3, Tir en campagne) ; sinon une série libre est créée.", "En haut, l'app indique si tous les totaux imprimés correspondent aux coups lus, ou ce qu'il faut vérifier (p. ex. une série dont la somme ne correspond pas ou un coup illisible). Vérifie les valeurs avant d'enregistrer.", "Conseils : pose la bande à plat, évite les reflets et les ombres marquées, et cadre la partie imprimée en grand. Une photo floue ne peut pas être lue. Sur iPhone et Android, la photo est lue sur l'appareil ; la version web a besoin d'une connexion internet la première fois."]}, {"t": "Formats de série", "p": ["F300 : 10 coups A10 · 2×10 coups par coup A10 (deux sous-totaux, un total) · 10 coups dont 6 coup par coup, 4 en série · 12 coups dont 2 d'essai, 6 coup par coup, 4 en série · 12 coups dont 2 d'essai, 5 coup par coup, séries de 2 et 3 · Tir obligatoire (20 coups A5/B4) · Tir en campagne (18 coups B4) · Libre (coups, essais et cible A10, A100, B4, B5, A5 au choix).", "P25 et P50 : Standard 5/5/5 · Tir obligatoire 5 coup par coup + 5/5/5 · Tir en campagne 3 coup par coup + 5/5/5 · Libre. Toujours 0–10.", "P10 et C10 : 10 coups · 20 coups · Libre. Toujours 0–10."]}, {"t": "Photos de cibles", "p": ["Sous Cibles, prends une photo ou choisis des images dans ta photothèque. Les photos sont réduites à 2000 pixels au plus : elles prennent peu de place et chaque impact reste lisible.", "Dans un exercice, touche une photo pour l'afficher en plein écran et zoomer."]}, {"t": "Écran d'accueil et graphique", "p": ["En haut, filtre par une discipline (Tous, F300, P25 …) et par une ou plusieurs catégories. Statistiques, graphique et liste ne montrent que les exercices choisis.", "Ø série et Meilleure série : chaque série est convertie en 10 coups sur A10 (0–100), pour comparer 20 coups, B4 ou A100.", "Le graphique montre une ligne par année civile (janvier à décembre) avec la moyenne de chaque exercice. Quand un exercice a plusieurs séries, une barre grise avec des points montre les séries.", "Touche Résultat par année pour replier le graphique (avec la note sur la conversion) ou l'afficher à nouveau ; l'app retient ton choix.", "Les exercices sont groupés par année ; touche une année pour l'ouvrir ou la fermer.", "Touche un exercice pour l'ouvrir. La flèche à droite affiche un aperçu avec photo, détails et résultats ; toucher l'aperçu ouvre aussi l'exercice.", "En mode paysage, l'app en montre davantage : le graphique utilise toute la largeur et chaque ligne affiche aussi la discipline et les résultats des séries.", "Sélectionner : marque plusieurs exercices, puis supprime-les, imprime-les (tous les exercices choisis sur A4 avec séries et notes ; l'app demande s'il faut inclure jusqu'à quatre photos par exercice) ou envoie-les par e-mail (avec texte et photos de cibles)."]}, {"t": "Championnat", "p": ["Le bouton Championnat en haut ouvre la page Championnat avec tous les exercices de l'année. La roue dentée en haut à gauche ouvre Configurer le championnat : saisis l'adresse du fichier CSV de la société et touche Charger (plus tard Recharger), ou utilise Choisir un fichier.", "Le + rond en bas à droite d'une entrée crée l'exercice avec discipline, séries, description et catégorie Championnat, puis l'ouvre. L'entrée s'affiche ensuite en gris avec une coche /* ---------- printing selected sessions (full page width, one block per session) ---------- */
async function printSessions(ids, withPhotos = true) {
  const xs = S.sessions.filter((x) => ids.includes(x.id)).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const urls = new Map();
  if (withPhotos) for (const x of xs) for (const id of (x.photos || []).slice(0, 4)) { try { const b = await photoGet(id); if (b) urls.set(id, URL.createObjectURL(b)); } catch {} }
  const range = xs.length > 1 ? `${fmtDate(xs[0].date)} – ${fmtDate(xs[xs.length - 1].date)}` : xs.length ? fmtDate(xs[0].date) : "";
  const blocks = xs.map((x) => {
    const meta = [x.location && `${t("range")}: ${x.location}`, x.weapon && `${t("weapon")}: ${x.weapon}`, x.conditions && `${t("conditions")}: ${x.conditions}`].filter(Boolean).join(" · ");
    const rows = x.series.map((sr, i) => { const ss = seriesStats(sr, x.max), gl = groupLine(sr);
      return `<tr><td class="pr-c">${i + 1}</td><td>${esc(seriesLabel(sr))}</td><td class="pr-shots">${esc(sr.shots.length ? shotsText(sr) : ss.manual ? t("totalOnly") : "—")}${gl ? `<br><b>${esc(gl)}</b>` : ""}</td><td class="pr-c">${ss.x || ""}</td><td class="pr-c">${sr.tief != null ? sr.tief : ""}</td><td class="pr-r"><b>${fmtScore(ss.total)}</b> / ${ss.max}</td></tr>`; }).join("");
    const pics = (x.photos || []).slice(0, 4).filter((id) => urls.has(id)).map((id) => `<img src="${urls.get(id)}" alt="">`).join("");
    const st = sessionStats(x);
    return `<div class="pr-sess"><div class="pr-h"><span>${esc(fmtDate(x.date))} · ${esc(catLabel(x))} · ${esc(plabel(pkey(x)))}</span>${st.max ? `<span>${t("printTotal")} ${fmtScore(st.total)} / ${st.max}</span>` : ""}</div>
      ${descOf(x) ? `<p class="pr-desc">${esc(descOf(x))}</p>` : ""}${meta ? `<p class="pr-meta">${esc(meta)}</p>` : ""}
      <table><thead><tr><th class="pr-c">#</th><th>${t("seriesFormat")}</th><th>${t("shotsH")}</th><th class="pr-c">X</th><th class="pr-c">${t("tiefShort")}</th><th class="pr-r">${t("score")}</th></tr></thead><tbody>${rows}</tbody></table>
      ${x.notes ? `<p class="pr-notes"><b>${t("notes")}:</b> ${esc(x.notes)}</p>` : ""}${pics ? `<div class="pr-pics">${pics}</div>` : ""}</div>`;
  }).join("");
  let area = $("#printArea"); if (!area) { area = document.createElement("div"); area.id = "printArea"; document.body.appendChild(area); }
  area.innerHTML = `<div class="pr-head"><div class="pr-title">${t("appName")} · ${t("printTitle")}</div><span>${esc(range)} · ${t("sessionsN", xs.length)}</span></div>${blocks}`;
  const done = () => { area.innerHTML = ""; for (const u of urls.values()) URL.revokeObjectURL(u); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  await Promise.all([...area.querySelectorAll("img")].map((im) => (im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; }))));
  window.print();
}

/* ---------- hold the logo for 10 seconds: switch between app icon and SG Muttenz logo ---------- */
(() => {
  let timer = null;
  const stop = () => { clearTimeout(timer); timer = null; };
  document.addEventListener("pointerdown", (e) => {
    if (!e.target.closest("#logobtn")) return;
    stop();
    timer = setTimeout(() => {
      timer = null; S.longPressed = true;
      S.clubLogo = !S.clubLogo; try { localStorage.setItem("scorebook-logo", S.clubLogo ? "club" : "app"); } catch {}
      if (navigator.vibrate) try { navigator.vibrate(30); } catch {}
      render(); toast(S.clubLogo ? t("logoClubOn") : t("logoClubOff"));
    }, 10000);
  });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) document.addEventListener(ev, (e) => { if (timer && (ev !== "pointerleave" || e.target.closest && e.target.closest("#logobtn"))) stop(); }, true);
  document.addEventListener("contextmenu", (e) => { if (e.target.closest && e.target.closest("#logobtn")) e.preventDefault(); });
})();

let tessWorker = null;
async function ocrWorker() {
  if (tessWorker) return tessWorker;
  if (!window.Tesseract) await new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    sc.onload = res; sc.onerror = () => rej(new Error("offline"));
    document.head.appendChild(sc);
  });
  try {
    tessWorker = await Tesseract.createWorker("deu", 1, { logger: (m) => { if (m.status === "recognizing text" && S.scanning) { S.scanPct = Math.round(m.progress * 100); scanStatus(); } } });
    await tessWorker.setParameters({ tessedit_pageseg_mode: "6" });   // one block of lines: keeps shot number, arrow and value together
  } catch { throw new Error("offline"); }
  return tessWorker;
}
function scanStatus() { const el = $("#scanstat"); if (el) el.textContent = S.scanPct != null ? `${t("scanReading")} ${S.scanPct}%` : t("scanReading"); }
function scanOverlay() {
  let el = $("#scanover");
  if (!S.scanning) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement("div"); el.id = "scanover"; el.className = "scanover"; el.setAttribute("role", "status"); el.innerHTML = `<div id="scanstat"></div>`; document.body.appendChild(el); }
  scanStatus();
}
// grey + more contrast (blue, yellow and grey paper look alike), longest side about 2400 px, optional quarter turn
function scanCanvas(img, turn = 0) {
  const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const c = document.createElement("canvas");
  c.width = turn ? h : w; c.height = turn ? w : h;
  const g = c.getContext("2d");
  g.filter = "grayscale(1) contrast(1.35)";
  if (turn) { g.translate(c.width / 2, c.height / 2); g.rotate(turn * Math.PI / 2); g.drawImage(img, -w / 2, -h / 2, w, h); }
  else g.drawImage(img, 0, 0, w, h);
  return c;
}
// word boxes normalized to 0…1 with the origin at the bottom left (as the parser expects)
async function ocrWords(canvas) {
  const wk = await ocrWorker();
  const { data } = await wk.recognize(canvas, {}, { blocks: true, text: false });
  let words = data.words;
  if (!words || !words.length) words = (data.blocks || []).flatMap((b) => b.paragraphs.flatMap((p) => p.lines.flatMap((l) => l.words)));
  const W = canvas.width, H = canvas.height;
  return words.filter((x) => x.confidence >= 30 && x.text.trim()).map((x) => ({ text: x.text.trim(), x: x.bbox.x0 / W, y: 1 - x.bbox.y1 / H, w: (x.bbox.x1 - x.bbox.x0) / W, h: (x.bbox.y1 - x.bbox.y0) / H }));
}
// trained printout reader (reader.js, model in reader.json + reader.bin): made for dot-matrix strips, works offline
let printoutReader = null;
async function loadReader() {
  if (printoutReader) return printoutReader;
  const [meta, bin] = await Promise.all([fetch("./reader.json").then((r) => r.json()), fetch("./reader.bin").then((r) => r.arrayBuffer())]);
  return (printoutReader = ScanReader.create(meta, bin));
}
async function readerWords(img) {
  const r = await loadReader();
  const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, gray = new Float32Array(w * h);
  for (let i = 0; i < gray.length; i++) gray[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2];
  await new Promise((res) => setTimeout(res, 30));   // let the "reading" overlay paint first
  return r.read(gray, w, h);
}
async function scanPhoto(file) {
  S.scanning = true; S.scanPct = null; render(); scanOverlay();
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const parse = (words) => ScanParser.mergeCopies(ScanParser.columns(words).flatMap((c) => ScanParser.parseAll(c)));
    let results = [];
    try { results = parse(await readerWords(img)); } catch (e) { console.warn("reader", e); }
    if (!results.length) results = parse(await ocrWords(scanCanvas(img)));   // Tesseract when the reader finds nothing
    if (!results.length) { S.scanning = false; scanOverlay(); render(); return toast(t("scanNone"), 7000); }
    // name, club and weapon printed sideways on SIUS-style strips (Pg strips have none)
    if (results.some((r) => !r.program || !/^\d+$/.test(r.program))) {
      try {
        const heads = [];
        for (const turn of [1, -1]) heads.push(ScanParser.parseHeader(ScanParser.rowsOf(await ocrWords(scanCanvas(img, turn)))));
        const best = heads.sort((a, b) => b.score - a.score)[0];
        if (best && best.score > 0) ScanParser.applyHeader(best, results);
      } catch { /* offline: no name and club, the values are there */ }
    }
    S.current = null; S.draft = scanDraft(results); S.active = 0; S.view = "edit"; S.scanning = false; scanOverlay(); render(); scrollTo(0, 0);
    addPhotos([file]);      // the photo of the printout is kept with the session
  } catch (e) {
    S.scanning = false; scanOverlay(); render();
    toast(e && e.message === "offline" ? t("scanOffline") : t("scanFail"), 7000);
  } finally { URL.revokeObjectURL(url); }
}
// One series per printout. Known 300 m programs get their format; anything else becomes a custom series.
function scanSeries(r) {
  const all = ScanParser.shots(r);
  const counts = r.series.map((s) => s.shots.length).join(",");
  const shots = all.map((x) => String(Math.round(x.value)));
  const prac = r.sighters.map((x) => String(Math.round(x.value)));
  const n = shots.length, maxV = Math.max(...shots.map(Number));
  // Tiefschuss: printed T/P value, or the best 100-value of the counted shots
  const deep = r.deepShots.length ? Math.max(...r.deepShots.map((d) => d.value))
    : all.some((x) => x.hundred != null) ? Math.max(...all.map((x) => x.hundred || 0)) : null;
  const base = { total: null, tief: deep != null && r.scoringMode !== "hundred" ? deep : null, target: "A10" };
  if (r.scoringMode === "hundred") return { ...base, type: "custom", target: "A100", planned: n, practice: prac.length, shots: prac.concat(shots) };
  if (counts === "6,3,3,6" && maxV <= 4 && !prac.length) return { ...base, type: "fs300", planned: 18, shots };
  if (counts === "5,5,2,3,5" && maxV <= 5 && !prac.length) return { ...base, type: "op300", planned: 20, shots };
  if (prac.length === 2 && counts === "5,2,3") return { ...base, type: "p2s5r23", planned: 12, shots: prac.concat(shots) };
  if (prac.length === 2 && counts === "6,4") return { ...base, type: "p2s6r4", planned: 12, shots: prac.concat(shots) };
  if (!prac.length && counts === "6,4") return { ...base, type: "s6r4", planned: 10, shots };
  if (!prac.length && counts === "10,10") return { ...base, type: "s2x10", planned: 20, shots };
  if (!prac.length && n === 10) return { ...base, type: "s10", planned: 10, shots };
  return { ...base, type: "custom", target: maxV <= 4 && n >= 6 ? "B4" : "A10", planned: n, practice: prac.length, shots: prac.concat(shots) };
}
function scanWarnText(w) {
  const f = ScanParser.fmt;
  switch (w.type) {
    case "noShots": return t("scanNone");
    case "seriesTotal": return t("scanWSeries", w.series, f(w.printed), f(w.computed));
    case "seriesHundred": return t("scanWSeriesH", w.series, w.printed, w.computed);
    case "grandTotal": return t("scanWTotal", f(w.printed), f(w.computed));
    case "hundredTotal": return t("scanWTotalH", w.printed, w.computed);
    case "shotValue": return t("scanWShot", w.shot, f(w.value), w.hundred);
    case "missing": return t("scanWMissing", w.numbers.join(", "));
    default: return t("scanWCopies");
  }
}
function scanDraft(results) {
  const d = newDraft();
  const r0 = results[0];
  const m = r0.date && /^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/.exec(r0.date);
  if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; d.date = `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; }
  d.preset = "r300";
  d.series = results.map(scanSeries);
  d.desc = r0.competition || r0.event || "";
  if (r0.weapon) d.weapon = r0.weapon;
  const labels = results.map((r) => [r.program && /^\d+$/.test(r.program) ? "Pg " + r.program : "", r.targetLabel ? (r.program && /^\d+$/.test(r.program) ? "" : t("scanTarget") + " ") + r.targetLabel : ""].filter(Boolean).join(" · ")).filter(Boolean);
  d.notes = t("scanNote", labels.join("; "));
  d.scanWarn = results.flatMap((r, i) => r.warnings.map((w) => (results.length > 1 ? `${i + 1}: ` : "") + scanWarnText(w)));
  return d;
}

/* ---------- actions ---------- */
function newDraft() {
  const last = S.sessions[0];
  const preset = last ? pkey(last) : "r300";
  return { id: null, date: today(), preset, category: last ? catOf(last) : "training", desc: "", location: last ? last.location || "" : "", weapon: last ? last.weapon || "" : "", conditions: "", notes: "",
    series: [newSeries(preset)], photos: [], addedPhotos: [], removedPhotos: [] };
}
function applyPreset(key, reset = true) {
  const d = S.draft;
  d.preset = PRESETS[key] ? key : "other";
  if (!PRESETS[d.preset].x) d.series.forEach((s) => (s.shots = s.shots.map((v) => (v === "X" ? 10 : v))));
  // Each discipline has its own formats; series in a format the new discipline lacks become custom.
  const allowed = formatsFor(d.preset), empty = d.series.every((s) => !hasResult(s));
  if (empty && reset) { d.series = d.series.map(() => newSeries(d.preset)); return; }
  d.series.forEach((s) => {
    if (!allowed.includes(stype(s))) {
      const st = seriesStats(s);
      s.type = "custom"; s.target = s.target || "A10"; s.practice = st.practiceN; s.planned = Math.max(st.counted, s.shots.length - st.practiceN);
    }
    if (!targetChoice(d.preset)) s.target = "A10";
    clampShots(s);
  });
}
function clampShots(s) {
  s.shots = s.shots.map((v, j) => { const m = segMax(s, j); if (v === "X") return m === 10 && (s.target || "A10") === "A10" && !(segAt(s, j) || {}).max ? "X" : m; return Math.min(Number(v), m); });
}
function addShot(v) {
  const d = S.draft, s = d.series[S.active];
  const ss = seriesStats(s, d.max);
  if (ss.manual) return;
  if (s.shots.length >= ss.planned) { toast(fixed(s) ? t("seriesFull") : t("seriesFullCustom")); return; }
  s.shots.push(v); s.total = null;

  if (s.shots.length >= ss.planned && S.active < d.series.length - 1) S.active++;
  if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
}

async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b), "image/jpeg", 0.85));
  } catch { return file; } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(files) {
  for (const f of files) {
    S.uploads++; render();
    try {
      const b = await compress(f);
      const r = await S.assets.upload(b, { type: b.type && b.type.startsWith("image/") ? b.type : "image/jpeg" });
      S.draft.photos.push(r.id); S.draft.addedPhotos.push(r.id);
    } catch (e) {
      toast(e && e.name === "QuotaExceededError" ? t("storageFull") : t("photoFail"));
    } finally { S.uploads--; render(); }
  }
}

async function save() {
  const d = S.draft;

  const tiefs = d.series.map((s) => String(s.tief ?? "").trim());
  const bad = tiefs.findIndex((v) => v !== "" && !(Number.isInteger(Number(v)) && Number(v) >= 0 && Number(v) <= 100));
  if (bad >= 0) { toast(t("tiefErr", bad + 1)); S.active = bad; const el = $("#ts-" + bad); if (el) el.focus(); return; }
  S.saving = true; render();
  const body = { date: d.date, preset: d.preset, category: CATS.includes(d.category) ? d.category : "other", location: d.location.trim(), weapon: d.weapon.trim(), conditions: d.conditions.trim(), notes: d.notes.trim(),
    photos: d.photos.slice(),
    desc: (d.desc || "").trim(), series: d.series.map((s) => ({ type: stype(s), target: stype(s) === "custom" ? s.target || "A10" : "A10", planned: fixed(s) ? seriesStats(s, 1).planned : seriesStats(s).counted, practice: stype(s) === "custom" ? seriesStats(s).practiceN : 0, shots: s.shots.slice(), ...(composite(s) ? { parts: s.parts.map((q) => ({ ...q })) } : {}), total: s.total === "" || s.total === null || s.total === undefined ? null : Number(s.total), tief: tiefs[d.series.indexOf(s)] === "" ? null : Number(tiefs[d.series.indexOf(s)]) })),

    s.target = TARGETS[el.value] ? el.value : "A10"; clampShots(s); S.active = i; render();
  }
  else if (el.dataset.tot !== undefined) { const s = S.draft.series[Number(el.dataset.tot)]; s.total = el.value === "" ? null : Number(el.value); setTimeout(render); }
});
document.addEventListener("input", (e) => {
  const m = e.target.dataset && e.target.dataset.m;
  if (m && S.view === "mail") {
    S.mail[m] = e.target.value;
    if (m !== "to") S.mail.edited = true;
    if (m === "to") { try { localStorage.setItem("scorebook-mailto", e.target.value.trim()); } catch {} }
    const a = $("#m-open"); if (a) a.href = mailHref();
    return;
  }
  if (e.target.dataset && e.target.dataset.ch === "url") { S.champ.url = e.target.value; saveChamp(); return; }
  const f = e.target.dataset && e.target.dataset.f;
  if (S.view === "edit" && e.target.dataset && e.target.dataset.tief !== undefined) { S.draft.series[Number(e.target.dataset.tief)].tief = e.target.value; return; }
  if (S.view === "edit" && f && ["date", "desc", "location", "weapon", "conditions", "notes"].includes(f)) S.draft[f] = e.target.value;
});
// The shot keypad steps aside while the total or the Tiefschuss is being typed.
document.addEventListener("focusin", (e) => { if (e.target.dataset && (e.target.dataset.tot !== undefined || e.target.dataset.tief !== undefined)) document.body.classList.add("typing"); });
document.addEventListener("focusout", (e) => { if (e.target.dataset && (e.target.dataset.tot !== undefined || e.target.dataset.tief !== undefined)) document.body.classList.remove("typing"); });
document.addEventListener("toggle", (e) => { if (e.target && e.target.id === "space") { try { localStorage.setItem("scorebook-space-open", e.target.open ? "1" : "0"); } catch {} } }, true);
document.addEventListener("submit", (e) => {
  if (e.target.id !== "kp-form") return;
  e.preventDefault();
  const cs = S.draft.series[S.active], inp = $("#kp-num"), v = Number(inp.value), max = segMax(cs, cs.shots.length);
  if (inp.value === "" || !Number.isInteger(v) || v < 0 || v > max) { toast(t("wholeNumber", max)); inp.focus(); return; }
  addShot(v); render();
  const next = $("#kp-num"); if (next) next.focus();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#lightbox").hidden) $("#lightbox").hidden = true; });

boot();
</script>
</body>
